- name: "Unknown"
  label: "UNKNOWN"
  group_name: "Others"
  description: "Default catch-all for documents that do not match any of the predefined classes. POSITIVES: documents lacking the distinctive issuer chrome / measurement units / title formats listed in the other classes — generic letters, receipts, invoices, blank pages, undecipherable scans, photographs without context, or unstructured text/images without identifying branding. Miscellaneous attachments that arrive in the loan-onboarding folder but do not satisfy any other DECISIVE RULE. NEGATIVES / NOT-THIS-CLASS: if ANY positive identifier of a defined class is present (UIDAI sun for AADHAR; 'INCOME TAX DEPARTMENT' header for PAN; ECI banner for VOTER_ID; 'REPUBLIC OF INDIA' MRZ for PASSPORT; State Transport DL header for DRIVING_LISCENCE; employer logo + Designation for SERVICE_ID; CKYC* fields for CKYC; 'Digilocker Data' XML for DIGI_KYC; bank-deposit running ledger for BANK_STATEMENT; lender SOA EMI block for SOA; Perfios sheet tabs for PERFIOS_REPORT; TRACES masthead for FORM_16; monthly Payslip for SALARY_SLIP; ITR-V acknowledgement for ITR; TransUnion CIBIL banner for CIBIL_REPORT; 'powered by data sutram' footer for DATASUTRAM; 'Dedupe Report' with coloured match bands for DEDUPE_REPORT; 'Residence FI REPORT' / 'Office FI REPORT' titles for the FI classes; CHECK IBB PRICE for MANUAL_IBB; kWh DISCOM for E_BILL; SCM / LPG cylinder for GAS_BILL; KL / Jalkal for WATER_BILL; Fixedline / Fiber for TELEPHONE_BILL; 10-digit mobile postpaid plan for POSTPAID_MOBILE_BILL; non-judicial stamp paper + Rent/Lease title for RENT_AGREEMENT; Property Tax / House Tax + Assessment/PID for PROPERTY_TAX_RECEIPT; physical RC card photo for REGISTRATION_CERTIFICATE; VAHAN portal print for VAHAN_REPORT), reclassify accordingly. DECISIVE RULE: Classify as UNKNOWN ONLY when no other class's DECISIVE RULE is satisfied."
  classification_confidence_threshold: 0.85

- name: "Application Form"
  label: "APPLICATION_FORM"
  group_name: "Application Documents"
  description: "TATA CAPITAL LIMITED 'NEW CAR/USED CAR LOAN APPLICATION FORM' -- a fillable multi-page (~7-9 page) vehicle-loan application. POSITIVES (observed in samples): page 1 has the blue TATA logo + 'TATA CAPITAL LIMITED', a boxed title 'NEW CAR/USED CAR LOAN APPLICATION FORM' with 'Used Car' and 'New Car/Commercial vehicle' checkboxes, bullets 'ALL FIELDS ARE COMPULSORY TO BE FILLED' / 'Not applicable fields should be marked as NA' / 'Please fill all the details in CAPITAL LETTERS only', a 'Do you have any existing relationship with TCL? Yes/No' box, a 'For Office use only' strip (Sales Manager Code, Branch Name/Code, DSA Code, Scheme Code e.g. UCL_Velo / UVEL_HRP), an affixed applicant photograph, and 'Personal Details of The Applicant(s) (For individuals)' with Occupation/Name/DOB/ID Proof grids. Following pages: If Salaried / If Self Employed income sections (Gross Annual Income, Business Turnover), 'DETAILS of VEHICLES and CREDIT FACILITY' (Vehicle Description, Manufacturer, Registration No, Loan Amount, Tenure, EMI, IRR), 'REFERENCES (Atleast one friend and one relative)', numbered TERMS & CONDITIONS and UNDERTAKINGS / DECLARATIONS referencing TCL, 'MOST IMPORTANT DOCUMENTS' checklist, 'ACKNOWLEDGMENT OF LOAN APPLICATON FORM', and 'ACKNOWLEDGEMENT FOR RECEIPT OF AGREEMENT' / 'Authority Letter For Payment to Third Party'. A vertical right-margin watermark banner runs down each page (e.g. '<refno> | SSO-SFDC | DD/MM/YYYY HH:MM:SS'). NEGATIVES / NOT-THIS-CLASS: NOT CIBIL_REPORT (no TransUnion CIBIL wordmark / CONSUMER CIR banner / 3-digit score); NOT VAHAN_REPORT or REGISTRATION_CERTIFICATE (those are single-page vehicle-registration extracts/cards, not a multi-section applicant form); standalone agreement/T&C or sanction letters without the application-form title and applicant/income/vehicle/reference grids are not this class. DECISIVE RULE: TATA Capital-branded form titled 'NEW CAR/USED CAR LOAN APPLICATION FORM' with Used Car/New Car checkboxes plus fill-in applicant, income, vehicle ('DETAILS of VEHICLES and CREDIT FACILITY') and REFERENCES sections."
  classification_confidence_threshold: 0.85



- name: "Aadhaar Card"
  label: "AADHAR_CARD"
  group_name: "OVD (KYC)"
  description: "Visual Aadhaar card / e-Aadhaar / enrolment slip issued by UIDAI. POSITIVES (observed in samples): tricolor saffron-green header with the Ashoka State Emblem on the left and the orange sun-with-fingerprint 'AADHAAR / आधार' logo on the right, dual title 'Government of India' + 'Unique Identification Authority of India', often also in a regional script (Kannada, Telugu, Marathi, Tamil). Body shows 'Enrolment No.: NNNN/NNNNN/NNNNN', a To-block of Name + S/O or D/O + multi-line residential address ending in a PIN, color photo, DOB, Gender, and a 12-digit 'Your Aadhaar No.' in four-four-four digits, frequently masked 'XXXX XXXX 7168', plus a 'VID : NNNN NNNN NNNN NNNN' line and a square QR beside the photo; bottom strip '1947', 'help@uidai.gov.in', 'www.uidai.gov.in'. The e-Aadhaar A4 PDF preserves this on one page (often 'SSO-SFDC' side-watermark, 'Details as on:' / 'Aadhaar no. issued:' stamps); the card back shows only the UIDAI band + Address + QR + 'QR Code with Photograph'. NEGATIVES / NOT-THIS-CLASS: an Aadhaar number quoted inside a stamp-paper deed/affidavit (party clauses, notary seal) is HUF_DEED / RENT_AGREEMENT, NOT this class. If the number is only a row in a 'Fields|Values' table with 'CKYC...' labels + 14-digit KIN it is CKYC; if inside a 'Digilocker Data' cell of raw '<EadhaarResponseXML>' / '<UidData uid=' XML or '/9j/4AAQ...' base64 it is DIGI_KYC/OKYC. DECISIVE RULE: the page must VISUALLY BE the UIDAI card chrome — Ashoka emblem + orange Aadhaar sun + 'Government of India / Unique Identification Authority of India' over a photo + 12-digit Aadhaar; text-only XML/JSON/registry dumps route to DIGI_KYC/CKYC."
  classification_confidence_threshold: 0.85
  


- name: "NSDL Report"
  label: "NSDL_REPORT"
  group_name: "OVD (KYC)"
  description: "PAN-verification report generated via NSDL / Protean (PAN status + Aadhaar-seeding check + Name/DOB match) bundled into the loan flow - a tabular status report, NOT a PAN ID card. POSITIVES (observed in samples): four layouts, ALL anchored by the NSDL PAN-status code legend. (a) 'NSDL Request | NSDL Response' two-column page with a 'Description | Details' grid: appId (e.g. 240643391997), panNumber (AJTPP4730G), attemptNumber, then on the Response side 'API Status code' 1, 'PAN No', 'PAN Status' single-letter code (E), 'Pan Title', First/Middle/Last Name, 'Last update date', 'PAN Aadhar Seeding Status' (Y), plus Name & DOB match (Y/N). (b) 'Case Details' block (Webtop, 'Date and Time of Verification', Source System 'Jocata Online') + 'NSDL Response' block (API Status code, PAN No, 'PAN Status' / 'Valid PAN', Pan Title, Name On Card, First/Middle/Last Name, Last update date, PAN Aadhar Seeding Status) ending with a bold 'Date & Time: DD-MM-YYYY HH:MM:SS' footer; filenames 'PAN_Validation_Report_*'. (c) a 'PAN verified by NSDL' title with a green tick and numbered rows (1 Loan AppNo, 2 PAN, First/Middle/Last Name, Phone, DOB (YYYY-MM-DD), Gender, 'Linked to Aadhaar' true/false, Aadhaar Number, 'Address as per PAN', 'Created by', 'Time of Pdf Creation') followed by 'Raw data as per API:' JSON (bucket 'muthootindia', pan_number, full_name, aadhaar_linked, gender, dob, verification_timestamp); filenames 'pan-<epoch>.pdf'. (d) a red-titled 'TATA CAPITAL - NSDL Fetch Report' with a 'Case Details' grid (Application Id e.g. PL49136, Webtop Id e.g. 386PZ8908858, Opportunity Id, Date and Time of Verification, Source System 'Salesforce LOS'), an 'NSDL Response' block (API Status code, PAN No, PAN Status), a 'Parameters | Request | Response/Match Status' table (Name On Card / PAN Aadhar Seeding Status / DOB-DOI with Y/N match), and a 'PAN Verification API Response code Details' Sr-No/Code/Description table (1 Success, 2 System Error, ... up to 29); it carries a red 'IP Address:172.26.x.x Date & Time: <ts>' header/footer and a vertical 'SSO-SFDC' watermark; filenames '386PZ<digits>.pdf'. EVERY variant prints the reference legends 'Aadhar Status Description / Status code' (Y,R,NULL,NA) and 'PAN Status Description / Status Code' (D,E,EC,EA,ED,EI,EL,EM,EP,ES,EU,X,F,N,I) plus Name/DOB Status tables - this code legend is the single most reliable signature. Filenames seen: '21.<PAN>_PanVerification...', 'PAN_Validation_Report_*', 'pan-<epoch>.pdf', '386PZ<digits>.pdf'. NEGATIVES / NOT-THIS-CLASS: DATASUTRAM is the TATA-CAPITAL 'PAN KEYS | VALUES' table with an 'AADHAAR LINKED true/false' row and the 'powered by data sutram' map-pin footer - NSDL instead has the PAN Status code legend and 'NSDL Request/Response' or 'NSDL Fetch Report' / 'PAN verified by NSDL' headings and NO data-sutram footer (note variant (d) shares the red 'IP Address ... Date & Time' footer + SSO-SFDC watermark with DATASUTRAM/VAHAN, so disambiguate on the PAN Status legend, not the footer). VAHAN_REPORT is the TATA Capital 'Vahan Report' vehicle key/value extract (Registration No / Chassis / Engine / RTO) with the same red IP footer - NSDL has a PAN No + PAN Status code, no vehicle fields. CKYC is a CKYC*-prefixed Fields/Values registry table with a 14-digit KIN. DIGILOCKER_OKYC is a 'Digilocker Data' EadhaarResponseXML/base64 dump. CIBIL_REPORT has the TransUnion CIBIL wordmark + 3-digit score. AADHAR_CARD/PAN_CARD are visual ID cards. DECISIVE RULE: an NSDL/Protean PAN-verification report - an 'NSDL Request/Response', 'NSDL Fetch Report', 'PAN verified by NSDL' or 'PAN_Validation_Report' block carrying a PAN No + single-letter 'PAN Status' and 'PAN Aadhar Seeding Status' AND the 'PAN Status Description ... Status Code (D/E/EC.../N/I)' legend - regardless of source system (Jocata Online / Salesforce LOS) or wrapper branding."
  classification_confidence_threshold: 0.85
  


- name: "PAN Card"
  label: "PAN_CARD"
  group_name: "OVD (KYC)"
  description: "Visual Permanent Account Number card issued by the Income Tax Department. POSITIVES (observed in samples): laminated landscape card, header left 'आयकर विभाग / INCOME TAX DEPARTMENT' in maroon, centred Ashoka State Emblem, right 'भारत सरकार / GOVT. OF INDIA'; sub-title 'स्थायी लेखा संख्या कार्ड / Permanent Account Number Card'. A prominent 10-character PAN in the strict AAAAA9999A pattern (5 letters + 4 digits + 1 letter, e.g., AZPPC1824J, CBGPS2467E, EDPPP4424M, BVXPS6422F). Cardholder Name, Father's Name, DOB (DD/MM/YYYY), holder signature, small portrait, pale teal Indian-monuments watermark. Old style stacks Name/Father/DOB/PAN at left with no QR; newer style adds a QR beside the PAN and a silver Govt-of-India hologram patch. CRUCIALLY there is NO residential address block. NEGATIVES / NOT-THIS-CLASS: any photo-card that ALSO carries a multi-line residential address is NOT pan — that is AADHAR_CARD (UIDAI sun + 12-digit number), VOTER_ID (ECI header + 3letter+7digit EPIC) or DRIVING_LISCENCE (Transport Dept + COV codes). If the PAN appears only as a 'CKYCPAN' / 'PAN KEYS' table row, classify CKYC / DATASUTRAM. e-PAN counts only when the card visual is preserved. DECISIVE RULE: 'INCOME TAX DEPARTMENT' + 'GOVT. OF INDIA' header + a 10-char PAN in AAAAA9999A + photo + DOB AND no address block."
  classification_confidence_threshold: 0.85


- name: "Digilocker / OKYC"
  label: "DIGILOCKER_OKYC"
  group_name: "OVD (KYC)"
  description: "DigiLocker / Offline e-KYC API-response dump rendered as a multi-page PDF - NOT the visual Aadhaar card. POSITIVES (observed in samples): page 1 is a single-cell document with the left label 'Digilocker Data' / 'DigiLocker Data' and a large literal dump on the right; in this folder the dump appears in TWO forms - (i) XML tags opening '<retStatus>SUCCESS</retStatus> <sysErrorMessage></sysErrorMessage> ... <EadhaarResponseXML><?xml version=1.0...><Certificate><CertificateData><KycRes ...><UidData ... uid=xxxxxxxx3935><Poi dob=... gender=... name=.../><Poa co=... house=.../><LData.../><Pht>/9j/4AAQ...', and (ii) JSON braces opening {EadharResponseXML:{Certificate:{Signature:{SignatureValue...}}}} (KycRes/UidData/Poi/Poa keys, X509 cert chain CN=DS NATIONAL E-GOVERNANCE DIVISION / CN=CCA India 2022 / CN=SafeScrypt CA 2022). Middle pages are continuous base64/MIIF... cert and photo data; trailing rows show 'Digilocker Address', 'Current Address as per Application form to be updated Yes/No', and a 'Photo' cell with the resident colour photo. EVERY page footer carries 'IP Address: <ipv4-or-ipv6> Date and Time / Date & Time: <timestamp>' plus a vertical SSO-SFDC banner. Filenames look like '<refno>PZ<digits>.pdf' or a UUID. NEGATIVES / NOT-THIS-CLASS: CKYC is a clean 'Fields/Values' or 'CKYC Request/Response' table with CKYC*-prefixed labels + 14-digit KIN - no XML/base64. AADHAR_CARD is the rendered UIDAI card (Ashoka emblem + orange sun + QR). NSDL_REPORT is an 'NSDL Request/Response' or 'PAN verified by NSDL' PAN-status report with the PAN Status Description code legend. DATASUTRAM is the 'PAN KEYS | VALUES' table with 'powered by data sutram' footer. DECISIVE RULE: page contains the literal 'Digilocker Data' header followed by an EadhaarResponseXML/EadharResponseXML payload (XML tags OR JSON braces) with UidData/Poi/Poa + a long '/9j/4AAQ...' base64 photo and an 'IP Address ... Date and Time' page footer."
  classification_confidence_threshold: 0.85
  


- name: "CKYC"
  label: "CKYC"
  group_name: "OVD (KYC)"
  description: "Central KYC Records Registry (CKYCR / CERSAI) record printed as a plain-paper key/value table - NOT a photo ID card. POSITIVES (observed in samples): two templates. (a) a single 'CKYC Report' table with header row 'Fields | Values' whose row labels are prefixed 'CKYC...': CKYCNamePrefix, CKYCFirstName, CKYCFullName, CKYCFatherFullName, CKYCMotherFullName, CKYCGender, CKYCDOB, CKYCPAN, CKYCPerAdd1..CKYCPerAddPin, CKYCMobileNumber, CKYCCorAdd*, CKYCDateofDeclaration, and a 14-digit 'CKYCNumber'/KIN (e.g. 20075626744984). (b) a 'CKYC Request | CKYC Response' layout with a 'Description | Details' grid: rows 'CKYC Number 40073275443724', 'CKYC PAN AJFPK0079H', 'CKYC Per Add POA AadhaarOffline', 'Transaction Status CKYCSuccess', 'ret Status SUCCESS', opp ID/webtop No/Transaction Id. No holder photograph, no QR, no government-card chrome, no base64/XML blob. NEGATIVES / NOT-THIS-CLASS: AADHAR_CARD is the visual UIDAI card (Ashoka emblem + orange Aadhaar sun + QR) - CKYC holds the Aadhaar only as a field value. DIGI_KYC has a 'Digilocker Data' cell with raw '<EadhaarResponseXML>'/'<UidData uid='/'<Poi dob=' XML or a long base64 '/9j/4AAQ...' photo payload - never in CKYC. OKYC is the DigiLocker JSON dump opening with curly braces {EadharResponseXML:{Certificate}} + Signature/base64 - CKYC has no JSON or signature blobs. NSDL_REPORT has NSDL/PAN Status Description code legend; DATASUTRAM has 'PAN KEYS | VALUES' + 'powered by data sutram' footer. DECISIVE RULE: plain key/value table whose field names are prefixed 'CKYC...' (or 'CKYC <word>') AND a 14-digit CKYCNumber/KIN."
  classification_confidence_threshold: 0.85
  


- name: "Driving License"
  label: "DRIVING_LICENSE"
  group_name: "OVD (KYC)"
  description: "Smart-card driving licence issued by a State/UT Transport Department / RTO under the Motor Vehicles Act. POSITIVES (observed in samples): credit-card-sized card titled 'Driving Licence / DRIVING LICENCE', headed by the union/state authority — 'UNION OF INDIA Driving Licence', 'THE UNION OF INDIA — MAHARASHTRA STATE MOTOR DRIVING LICENCE', 'India Driving Licence (Tamilnadu) Form 7' — with the Ashoka emblem and often 'RJ / NT' validity badges. DL number carries a state-RTO prefix: RJ18 20060068665, MH48 20150040892, TN02 20090005853, plus 'Form 7 / Form (1)'. Fields: Name, S/D/W of, DOB, multi-line Address with PIN, Date of Issue (DOI), Validity, Blood Group, holder photo, and a Class-of-Vehicle / COV table with codes LMV, MCWG, MCYCL.WG, TRANS, plus 'Authorisation to drive the following class of vehicles', 'Non-Transport Veh. Valid upto', 'Issuing Authority'. Many cards show an embossed gold chip and/or a state-monument watermark; often a 'SSO-SFDC' side-stamp or CamScanner footer. NEGATIVES / NOT-THIS-CLASS: VOTER_ID is the same card shape but headed 'ELECTION COMMISSION OF INDIA' with a 3letter+7digit EPIC and no RTO prefix / no COV. SERVICE_ID has an EMPLOYER header + Designation/Employee Code/Date of Joining, not COV codes. PAN_CARD has no chip, no COV, no address. DECISIVE RULE: 'Driving Licence' title + State/Union Transport Department branding + a DL number with a state-RTO prefix (XXNN NNNN...) + a Class-of-Vehicle table (LMV/MCWG/MCYCL/TRANS)."
  classification_confidence_threshold: 0.85
  


- name: "Marriage Certificate"
  label: "MARRIAGE_CERTIFICATE"
  group_name: "Relationship Documents"
  description: "Government-issued marriage-registration certificate (name / relationship proof, e.g. to evidence a spouse's name). POSITIVES (observed in samples): a statutory certificate issued by a State Marriage Registrar / Marriage Officer / municipal authority headed 'GOVERNMENT OF <STATE>' (e.g. Government of Karnataka, Govt. of Gujarat, 'HARYANA GOVT. GAZ.') with the Ashoka State Emblem, titled 'CERTIFICATE OF MARRIAGE' / 'MARRIAGE CERTIFICATE' / 'MARRIAGE REGISTRATION CERTIFICATE' / 'Certificate of Registration of Hindu Marriage', citing a Form + Act — e.g. 'FORM II-A [See Rule 4(5)]' or 'Form - IV' under the Hindu Marriage Act, 1955 (or the Special Marriage Act / Christian Marriage Act / state Registration of Marriages rules), often with a 'Registration under rule 3(i) and 3(3)(d)' line. Recites that two named parties (Bridegroom/Husband and Bride/Wife, each with Father's name, age and residence/condition) 'have been married to' / 'their marriage has been solemnized on <date> and has been registered', stamped with a Marriage Number / CD Number / Registration entry (formats such as '2153' or 'KRI-HM573-2017-18'), a 'Registrar of Marriages' / 'Marriage Officer' (or 'Marriage Registrar') signature + round registrar seal, and frequently a joint photograph of the couple ('Joint Photo of Husband and Wife') plus both parties' and witnesses' signatures. NEGATIVES / NOT-THIS-CLASS: NOT BIRTH_CERTIFICATE (a single individual with Date of Birth / Place of Birth and parents only — no spouse, no 'solemnized on'). NOT RENT_AGREEMENT / HUF_DEED / PARTNERSHIP_DEED / TRUST_DEED or other stamp-paper deeds (lessor-vs-lessee, Karta/coparcener, partner or trustee clauses — not a marriage registration). NOT a national photo-ID card. DECISIVE RULE: a government marriage-registration certificate naming a Bridegroom & Bride, a 'marriage solemnized on <date>' + a registration entry/number, and a Registrar of Marriages signature/seal (often with the couple's joint photo)."
  classification_confidence_threshold: 0.85
  


- name: "Birth Certificate"
  label: "BIRTH_CERTIFICATE"
  group_name: "Relationship Documents"
  description: "Government-issued Birth Certificate / registration of birth, used as a date-of-birth / age proof. POSITIVES (observed in samples): a statutory FORM (commonly 'Form 5' / 'Form No. 5' under the Registration of Births and Deaths (RBD) Act, 1969) issued by a Municipality / Municipal Corporation / Gram Panchayat / Chief Registrar of Births and Deaths of a State, headed 'Government of India' + 'GOVERNMENT OF <STATE>' (e.g. GOVERNMENT OF KARNATAKA) with the Ashoka State Emblem and frequently the public-awareness tagline 'Ensure registration of every birth and death'; centred title 'BIRTH CERTIFICATE' / 'जन्म प्रमाण पत्र' (often bilingual — Kannada/Hindi/Marathi/Tamil + English) with the sub-line 'Issued Under Section 12/17 of the RBD Act, 1969 and Rule 8/13 of the <State> Rules'. Body is a numbered field list: Name (of the child), Sex, Date of Birth, Place of Birth, Name of Mother, Name of Father, Address of parents at the time of birth, Permanent address of parents, Registration No., Date of Registration, Remarks (if any), Date of Issue, plus a certification line ('issued from the original record of birth ...') and the Signature + Address of the Issuing Authority / Registrar with an official seal; e-certificate variants add a QR code and a 'digitally signed' footer. NEGATIVES / NOT-THIS-CLASS: NOT MARRIAGE_CERTIFICATE (that registers a marriage between TWO parties — a bridegroom & bride, a 'solemnized on' date and usually a joint couple photo). NOT a national photo-ID card (AADHAR_CARD / PAN_CARD / VOTER_ID / PASSPORT) — a birth certificate carries NO holder photo and NO Aadhaar/PAN/EPIC number even though it shows a DOB. NOT any utility/address-proof bill or stamp-paper deed. DECISIVE RULE: a government 'BIRTH CERTIFICATE' (Form 5 / RBD Act 1969) issued by a municipal body / Registrar of Births & Deaths recording ONE individual's Name + Date of Birth + Place of Birth + parents' names with a Registration No. and a Registrar signature/seal."
  classification_confidence_threshold: 0.85
  


- name: "Voter ID"
  label: "VOTER_ID"
  group_name: "OVD (KYC)"
  description: "Electoral Photo Identity Card (EPIC) issued by the Election Commission of India, including the e-EPIC PDF. POSITIVES (observed in samples): header 'ELECTION COMMISSION OF INDIA / भारत निर्वाचन आयोग' with the Ashoka emblem on the left and a small tricolor election-ink ballot/finger icon on the right; sub-title 'Elector Photo Identity Card / मतदाता फोटो पहचान पत्र' (older cards say 'IDENTITY CARD'). EPIC number is 3 letters + 7 digits (e.g., WGO9699828, XHL6053573, BFS1851690, GLM0077909) with NO state-RTO numeric prefix. Layout: holder photo at left; Name, Father's/Husband's Name, Gender, Date of Birth/Age; the colorful tricolor-rays card background. The e-EPIC variant is an A4 PDF with the card tile plus a key/value block 'EPIC No.', 'Serial number', 'Assembly Constituency No. and Name', 'Part No. and Name', 'Polling Station Address', a QR, 'Electoral Registration Officer / ERO', '1950' helpline, 'eci.gov.in' and a Download Date. NEGATIVES / NOT-THIS-CLASS: if the header says a State Transport Department / 'Driving Licence' and the ID has an RTO prefix (KA03 / MH12 / RJ18 / TN02), it is DRIVING_LICENSE (occasionally mis-filed here). 'REPUBLIC OF INDIA' + MRZ = PASSPORT. UIDAI orange-sun tricolor header = AADHAR_CARD. PAN_CARD has no EPIC and no address. DECISIVE RULE: 'ELECTION COMMISSION OF INDIA' / 'भारत निर्वाचन आयोग' header (or e-EPIC tile with EPIC No. + Assembly Constituency + ERO) AND an EPIC ID in 3-letter+7-digit format."
  classification_confidence_threshold: 0.85
  


- name: "Rent Agreement"
  label: "RENT_AGREEMENT"
  group_name: "DOVD (KYC)"
  description: "Notarised rental / lease / leave-and-licence deed between landlord and tenant (address proof). POSITIVES (observed in samples): page 1 is a Government of India non-judicial stamp paper / e-Stamp - 'INDIA NON JUDICIAL' banner, State Emblem, state name (Uttar Pradesh / Govt of NCT of Delhi), Certificate No (IN-UP..., IN-DL...), denomination (Rs.50/100), 'Description of Document: Rent deed / Lease', First Party (Lessor/Landlord) vs Second Party (Lessee/Tenant), and a round 'NOTARY GOVT OF INDIA' / Advocate seal (e.g. Renu Bala Reg.No.16727, Naqi Asad). The deed is titled 'RENT AGREEMENT' / 'RENTAL AGREEMENT' / 'LEAVE AND LICENCE' and recites: BETWEEN lessor and lessee with addresses, an 11-month tenancy with from/to dates, monthly rent in Rs., security deposit, residential-purpose clause, numbered terms, witness names and signatures of both parties + notary attestation date. NEGATIVES / NOT-THIS-CLASS: it is a multi-page legal DEED - no utility issuer logo, no consumption units (kWh/SCM/KL), no Assessment No/ARV tax table; other stamp-paper deeds (affidavit, sale deed, marriage certificate) carry different titles, so the title must read Rent/Rental/Lease/Tenancy. DECISIVE RULE: India Non-Judicial stamp-paper / e-Stamp header + a deed titled Rent/Rental/Lease Agreement naming Lessor-vs-Lessee parties with an 11-month rent clause, witness signatures and a notary seal."
  classification_confidence_threshold: 0.85
  


- name: "Electricity Bill"
  label: "E_BILL"
  group_name: "DOVD (KYC)"
  description: "Electricity utility bill from a state/regional DISCOM or private power distributor (address proof). POSITIVES (observed in samples): issuer is a power distribution company - Pashchimanchal Vidyut Vitran Nigam Ltd (PVVNL/UPPCL), Dakshin Haryana Bijli Vitran Nigam (DHBVN), HESCOM/Hubli ESCOM, BESCOM, APSPDCL, MSEDCL; titled 'Electricity Bill' / 'विद्युत बिल'. Core unit is electrical energy in kWh / KWH / KVAH ('Net Billed Unit', 'Billed Units KWH/KVAH', present/previous meter reading in units). Distinctive fields: Sanctioned Load / Sanc Load in kW, Tariff codes (LMV1 PV Residential/Domestic, DS/DSKW-SP, SLT-1, LT1), Energy Charges, Fixed/Demand Charges, FPPCA / Fuel Surcharge Adjustment, Electricity Duty, GOK P&G Surcharge, Meter Make & Number, Connection/Reading Date, Disconnection Date, footer citing Electricity Supply Code / Electricity Act 2003. NEGATIVES / NOT-THIS-CLASS: NOT PROPERTY_TAX_RECEIPT - a DISCOM electricity bill is never municipal property/house tax (no Assessment No / PID / ARV / Tax Head list); a municipal bill that lists 'Water Tax / General Tax / Education Tax' against an ARV is PROPERTY_TAX_RECEIPT, not E_BILL. NOT GAS_BILL (SCM / 14.2Kg LPG cylinder), NOT WATER_BILL (KL water/sewerage from a Jal Board), NOT TELEPHONE_BILL / POSTPAID_MOBILE_BILL (minutes/GB). DECISIVE RULE: bill names a power DISCOM AND meters consumption in kWh / KVAH with Energy Charges and a Sanctioned Load in kW."
  classification_confidence_threshold: 0.85
  


- name: "Gas Bill"
  label: "GAS_BILL"
  group_name: "DOVD (KYC)"
  description: "Gas utility bill - either Piped Natural Gas (PNG) statement or LPG cylinder refill memo (address proof). POSITIVES (observed in samples): (a) PNG bill from a city gas distributor - Indraprastha Gas Ltd (IGL), MGL, Adani Gas - with 'Business Partner No', 'Sale of Natural Gas', consumption and Price in SCM (Standard Cubic Meter), Basic Cost of Gas + Supply & Distribution + Margin + VAT, Consumption Security Deposit, CNG/PNG branding. (b) LPG cylinder refill 'Tax Invoice' / 'GST Invoice' / 'Cash Memo' from Bharatgas (Bharat Petroleum), HP Gas, Indane (Indian Oil) via a named distributor/agency - with '14.2 Kg' or '10KgFIB' cylinder, HSN 27111900 (LPG) or 73110010 (cylinder), 'Domestic LPG', DGCC Book No, Cons No / Consumer No, 'Refill Order (DBC)', Subsidy/Quota in Kg, CGST/SGST @2.5%. NEGATIVES / NOT-THIS-CLASS: E_BILL meters kWh/KVAH with Sanctioned Load in kW; WATER_BILL meters KL with water/sewerage charges from a Jal Board; TELEPHONE_BILL/POSTPAID_MOBILE_BILL list minutes/GB; PROPERTY_TAX_RECEIPT is municipal tax with Assessment No/ARV. DECISIVE RULE: document mentions 'SCM' / 'Natural Gas' / 'PNG' / 'CNG' OR is an LPG refill memo from Bharatgas/HP Gas/Indane with 'Cylinder' / '14.2 Kg' / 'Refill Order' / 'Domestic LPG' / cylinder HSN."
  classification_confidence_threshold: 0.85
  


- name: "Telephone Bill"
  label: "TELEPHONE_BILL"
  group_name: "DOVD (KYC)"
  description: "Landline / broadband (fiber / FTTH / Wi-Fi) telecom statement (address proof). POSITIVES (observed in samples): issuer is BSNL (Bharat Fiber), Airtel ('FIXEDLINE AND Wi-Fi SERVICES', Airtel Xstream Fiber), JioFiber / Reliance Jio FTTH, ACT, Hathway. The service identifier is a LANDLINE number with an STD area code (e.g. TELEPHONE NO 04639290936) OR an explicit 'Fixedline number' + 'Wi-Fi ID' pair OR a 'Jio Fiber ID' / 'Fiber connection ID'. Plan/tariff names are broadband: 'Bharat Fiber 1500GB CS55', 'WiFi+DTH 300Mbps', 'JioFiber_1M_399', 'Postpaid_999_3M' with Mbps speed, 'FTTH'. Usage shown in Voice(Min) and Data(GB), HSN 998412 Fixed Telephony Service. NEGATIVES / NOT-THIS-CLASS: POSTPAID_MOBILE_BILL has a bare 10-digit cellular number (starting 6/7/8/9) as the service identifier under a 'MOBILE SERVICES' header with a cellular plan (Infinity 449, MyPlan) and HSN 998413 Mobile Telecommunication Service, and NO Fixedline/Fiber/Wi-Fi ID/Mbps terms. E_BILL/GAS_BILL/WATER_BILL meter power/gas/water. DECISIVE RULE: telecom bill whose primary service identifier is a landline-with-STD number OR a Fixedline / Wi-Fi ID / Fiber / FTTH / Broadband connection ID with a Mbps-speed plan."
  classification_confidence_threshold: 0.85
  


- name: "Postpaid Mobile Bill"
  label: "POSTPAID_MOBILE_BILL"
  group_name: "DOVD (KYC)"
  description: "Cellular postpaid bill from a mobile network operator (address proof). POSITIVES (observed in samples): issuer is Airtel (red wordmark, 'MOBILE SERVICES' header, Airtel number), Jio ('JIO DIGITAL LIFE'), Vi, BSNL Mobile. Service identifier is a 10-digit MOBILE number starting 6/7/8/9 shown as 'Airtel number' / 'Mobile <num>' / 'Jio Number'. Plan names are cellular: 'infinity 449 plan', 'MyPlan', 'Smartphone Postpaid Plan', 'Postpaid_999'. Line items: Monthly rentals / Plan Charges, Voice (Local/STD), Data, ISD, CGST/SGST; HSN 998413 Mobile Telecommunication Service; Airtel Thanks / MyJio app QR. NEGATIVES / NOT-THIS-CLASS: TELEPHONE_BILL when the identifier is a landline STD number OR a 'Fixedline number' / 'Wi-Fi ID' / 'Fiber' / 'Jio Fiber ID' / 'FTTH' / 'Broadband' connection with a Mbps plan - even when issued by Airtel / Jio / BSNL those are TELEPHONE_BILL (several fiber bills are mis-filed here). Bundled invoices may carry multiple sections (mobile + fixedline + DTH); classify by the dominant/lead plan. Utility bills meter kWh/SCM/KL. DECISIVE RULE: telecom bill whose service identifier is a bare 10-digit mobile number under a Mobile/cellular plan WITHOUT any Fixedline / Fiber / Wi-Fi ID / FTTH / Mbps terminology."
  classification_confidence_threshold: 0.85
  


- name: "Bank Statement"
  label: "BANK_STATEMENT"
  group_name: "Bank Statement"
  description: "Deposit-account statement (savings/current) issued directly by a bank. POSITIVES (observed in samples): top-of-page bank logo of a deposit institution (Union Bank of India 'A Government of India Undertaking', HDFC Bank 'We understand your world', IDFC FIRST, ICICI, YES, SBI, Kotak, Axis); title 'Statement of account' / 'STATEMENT OF ACCOUNT FOR THE PERIOD FROM <d> TO <d>' / 'Details of Statement'; header block with deposit identifiers Customer ID, Account Number (SBA/Savings/Current), IFSC, MICR, Branch, A/C Open Date, Account Type, Nomination, Re-KYC Due Date; body is a long chronological ledger with columns Date / Value Date / Particulars(Narration) / Chq Ref No / Withdrawal(Dr) / Deposit(Cr) / running Balance (often suffixed 'Cr'). Narrations are mixed third-party strings — 'UPIAR/.../DR/...', 'UPIAB/.../CR/...', 'NACH/10/...', 'NEFT:...', 'IMPS-...', ATM, SMS/interest charges; running balance fluctuates row to row; ends with Total Debits/Total Credits/Closing Balance and a bank CIN/registered-office footer. NEGATIVES / NOT-THIS-CLASS: SOA is a lender LOAN-account statement — even when bank-branded (IDFC FIRST/ICICI/Bajaj) it carries a Sanction/Creation Date + Rate of Interest + Tenure(Months) + Instalment/EMI header block and repeating 'Due for Instalment No. N' / 'Due For Instalment N' rows instead of UPI/NEFT narrations. PERFIOS_REPORT is a Perfios Excel analytics workbook (sheet tabs, 'Perfios Transaction Id'), not the bank's own PDF ledger. FINBOX is a 'WORKFLOW EVALUATION REPORT' EPV report. DECISIVE RULE: bank-branded savings/current statement whose rows form a recomputed running balance with mixed third-party UPI/NEFT/IMPS/NACH narrations and NO 'Sanction Date / Tenure / EMI / Instalment' loan header."
  classification_confidence_threshold: 0.85
  


- name: "Service ID"
  label: "SERVICE_ID"
  group_name: "Office Address Proof"
  description: "Employer / organisation-issued identity card establishing employment with a government department, PSU, school, or private firm. POSITIVES (observed in samples): header carries an EMPLOYER logo and name (not a national-authority chrome), e.g., 'Government of Assam — Department of Secondary Education — Teacher / Employee ID Card' (UDISE Code + Teacher/Emp. Code), 'ASSAM PUBLIC SERVICE COMMISSION', a 'Reliance Retail' access card, a 'FOCUS GROUP' lanyard badge. Fields are role-of-employment oriented: Employee / Card / Ticket / Emp Code, Designation (e.g., 'Head Teacher', 'Auditor', 'Driver'), Department / School Name, Date of Joining, Blood Group, holder photo, org address + helpline, 'Emp. Signature' and an 'Issuing Authority / Principal Secretary' signature; reverse often reads 'access card', 'If found please return to ...', 'non-transferable ... surrendered on leaving service', 'HR Contact'. Styles vary widely (orange access card, vertical lanyard, govt colour strip). NEGATIVES / NOT-THIS-CLASS: any card headed by UIDAI (orange Aadhaar sun), 'INCOME TAX DEPARTMENT', 'ELECTION COMMISSION OF INDIA', a State Transport Department/'Driving Licence', or 'REPUBLIC OF INDIA' is NOT this class even with a photo (route to AADHAR_CARD / PAN_CARD / VOTER_ID / DRIVING_LISCENCE / PASSPORT). State-government cards ARE Service IDs when they name an employment role (Designation / Employee Code / Date of Joining / School) rather than a citizen-ID number. DECISIVE RULE: header names an EMPLOYER/organisation AND the card uses role-of-employment fields (Designation / Department / Employee Code / Date of Joining) in place of a national-ID number."
  classification_confidence_threshold: 0.85
  


- name: "Finbox Report"
  label: "FINBOX"
  group_name: "Bank Statement"
  description: "Automated employment/employer verification (EPV) 'WORKFLOW EVALUATION REPORT' — a 3-5 page system-generated decision PDF, NOT a bank statement and NOT bank-statement analytics. POSITIVES (observed in samples): bold centered title 'WORKFLOW EVALUATION REPORT'; 'BASIC INFORMATION' grey key-value table with rows WORKFLOW NAME (e.g. 'main parent v0.0.46'), USERID, PROGRAM 'EPV', FINAL DECISION (APPROVED green / CANT_DECIDE red / REJECTED), CREATED AT, COMPLETED AT; 'INPUT VARIABLES' with EMPLOYER_NAME, APPLICANT_NAME, APPLICATION_ID (e.g. 'PL574279','PL632498'), EMAIL/EMAIL_ID, MOBILE, PAN; 'OUTPUT VARIABLES' with company/employment verification fields CIN, COMPANY_AGE_IN_YEARS, COMPANY_REGISTERED_EMAIL, COMPANY_STATUS, COMPANY_VERIFICATION_OUTPUT, DIRECTOR_NAME_LIST, DOMAIN_/EMAIL_VERIFICATION_OUTPUT, EMPLOYEE_NAME_FROM_UAN, EMPLOYER_NAME_MATCH_SCORE, EMPLOYER_PF_RELATED_DETAILS (EPFO monthly employees_count / total_amount_of_pf_fillings JSON), EMPLOYMENT_HISTORY_DATA (doj/doe/employment_period_in_months), NAME_MATCH_SCORE, UAN_FETCHED, UAN_FLOW_OUTPUT; then a 'WORKFLOW OUTCOMES' section with per-ruleset PASS/FAIL grids (Company/Domain/Email/UAN Validation) and 'REJECTION REASONS'; footer 'Generated on <ts> | Workflow Evaluation System'. ALL-CAPS snake_case field names in flat two-column tables; in these samples there is no Finbox/Perfios logo. NEGATIVES / NOT-THIS-CLASS: BANK_STATEMENT is a bank transaction ledger; PERFIOS_REPORT is a Perfios Excel workbook with inflow/outflow analytics sheet tabs; SOA is a lender loan statement; OFFICE_FI_REPORT is a field-visit report with agent observations/photos, not an automated UAN/EPFO workflow; NSDL_REPORT/DATASUTRAM are other third-party checks without this layout. DECISIVE RULE: title 'WORKFLOW EVALUATION REPORT' + PROGRAM 'EPV' + FINAL DECISION row + UAN/EPFO employment-verification OUTPUT VARIABLES."
  classification_confidence_threshold: 0.85
  


- name: "Perfios Report"
  label: "PERFIOS_REPORT"
  group_name: "Bank Statement"
  description: "Perfios bank-statement analytics workbook (Excel) — analytics derived FROM a bank statement, not the statement itself. POSITIVES (observed in samples): file is an OOXML/xlsx workbook (extension is .xls but it is a zip-based xlsx internally). The sheet-tab list is the unmistakable Perfios signature — 'Personal Loan1','EOD Balances1','Funds Received1','Funds Remittances1','Recurring Debits1','Recurring Credits1','BreakUp-Expense1','BreakUp-Income1','High Credits1','emiLoanXns1','Derived Analysis Personal','Transactions-Acc1','Salary Xns Sheet1','Imputed Summary 1','Imputed Income Xns 1'. The first sheet ('Personal Loan1') has a 'Customer Info' header with rows Applicant Name, Address, Bank Name (e.g. 'HDFC Bank, India'/'ICICI Bank, India'/'Yes Bank, India'), Account number, Branch, PAN, Ifsc Code, Email Id, Mobile Number, 'Perfios Transaction Id' (e.g. CPMN1758696614347, XZX71758638734506, HDGZ1757672966739), 'Account Holder Name Match: No/Yes', Date-Time, Account Open Date, DOB. 'Monthwise Details' grid lists Total No./Amount of Credit & Debit Transactions, Cash Deposits/Withdrawals, Cheque Deposits/Issues, bounce counts, Min/Max/Average EOD Balance. Filenames embed '_perf<digits>_..._accountAggregator.xls' / '_statement.xls' / '_netbankingFetch.xls'. NEGATIVES / NOT-THIS-CLASS: BANK_STATEMENT is the bank's own PDF ledger with a running balance and no Perfios sheet tabs / no 'Perfios Transaction Id'. SOA is a lender loan-account PDF (Sanction/EMI/Tenure). FINBOX is a 'WORKFLOW EVALUATION REPORT' PDF (EPV/UAN), not an Excel workbook. CIBIL_REPORT is a bureau credit report. DECISIVE RULE: multi-sheet Excel workbook containing a 'Perfios Transaction Id' field OR sheets named 'EOD Balances1' / 'Funds Received1' / 'BreakUp-Expense1' / 'Imputed Income Xns 1', OR filename embeds '_perf<digits>_..._accountAggregator/statement/netbankingFetch.xls'."
  classification_confidence_threshold: 0.85

- name: "Registration Certificate"
  label: "REGISTRATION_CERTIFICATE"
  group_name: "Registration Certificate"
  description: "The issued Vehicle Registration Certificate (RC) itself, in ANY rendering -- a photograph of the physical plastic RC smart-card, a scanned/printed Form 23 or Form 23A certificate, or an mParivahan e-RC / 'Virtual RC' output that presents the Certificate of Registration. POSITIVES (observed in samples): the document IS the RC -- title 'CERTIFICATE OF REGISTRATION' / 'Indian Union Vehicle Registration Certificate' / 'Form 23' / 'Form 23A', Ashoka state emblem with 'GOVERNMENT OF <STATE>' (e.g. West Bengal Kalyani ARTO, Chhattisgarh State), the full RC field set (Regn No, Date of Regn, Regn Validity, Owner Serial, Chassis No, Engine/Motor No, Owner Name, S/D/W of, Address, Maker, Model, Vehicle Class, Fuel, Emission Norms, Seating, Unladen Wt, Cubic Cap, HSRP No), a gold SIM-style chip or a 2D QR printed ON the card, and a 'Registering Authority' signature + round RTO seal. Variants seen: phone-shot CamScanner card with chip + orange state-map background; flat scanned Form 23A two-sided card (NT/WB roundels, vertical Card Issue Date); and a 2-page mParivahan set whose first page is a 'Virtual RC' app view (QR + Owner/vehicle rows + 'Return to Home') FOLLOWED BY the Form 23 'CERTIFICATE OF REGISTRATION' page bearing the Sub-Divisional / Registering Authority seal. NEGATIVES / NOT-THIS-CLASS: NOT VAHAN_REPORT -- VAHAN_REPORT is a Vahan DATABASE EXTRACT / query report (a 'Tata Capital ... Vahan Report' key/value table with a red 'IP Address ... Date & Time' footer, or a Parivahan NR portal print with 'Welcome <user>/Logout/Print/Back' chrome and VEHICLE/OWNER/HYPOTHECATION/INSURANCE/BLACKLIST DETAILS sections) and carries NO issued 'Form 23 / 23A Certificate of Registration' title or Registering-Authority seal. A 'Virtual RC' app page or a bare QR does NOT by itself make it VAHAN_REPORT. NOT APPLICATION_FORM / CIBIL_REPORT. DECISIVE RULE: the file contains the ISSUED Certificate of Registration -- the literal title 'CERTIFICATE OF REGISTRATION' / 'Indian Union Vehicle Registration Certificate' / 'Form 23' / 'Form 23A' with a Registering-Authority signature/seal, OR a photographed/scanned plastic RC card with a chip or card-printed QR -- EVEN IF an mParivahan 'Virtual RC' app page or QR also appears in the same file; only a pure Vahan extract table / NR portal print with NO such certificate page is VAHAN_REPORT."
  classification_confidence_threshold: 0.85
  


- name: "Vahan Report"
  label: "VAHAN_REPORT"
  group_name: "Vahan Report"
  description: "Computer-generated vehicle-registration DATABASE EXTRACT / query report pulled digitally from VAHAN / Parivahan or a financier's Vahan-extract system -- a data printout, NOT the issued Certificate of Registration and NOT a photo of a card. POSITIVES (observed in samples): two core formats. (a) Financier extract titled 'Tata Capital Limited Vahan Report' or 'Tata Capital Financial Services Vahan Report' -- a single-page blue-bordered key/value table with rows Opportunity ID, Registration No, Location of RTO, RC Status, Date of Registration, Chassis/Engine Number, Owner Serial Number, Manufacture, Model and Make, Fitness validity, Fuel Type, Colour, Blacklist, Vehicle Class, Cubic Capacity, Gross Weight, Vehicle Norms, PUC Validity, Name of Financier, Insurer Name, Insurance Policy/Validity, Permanent/Current Address; the hallmark is a red-text footer 'IP Address:172.27.x.x Date & Time:DD-MM-YYYY HH:MM:SS' (fields may all be '--' on an empty record -- still VAHAN_REPORT). (b) Parivahan / mParivahan NR portal print -- top-right '| Welcome <USER NAME>, |' with a 'Logout' link and 'Print'/'Back' buttons, a blue underlined heading 'The details of the records shown as per NR access policy.', a '[Status Last Replicated on ...]' line, then the sections VEHICLE DETAILS / OWNER DETAILS / HYPOTHECATION DETAILS / INSURANCE DETAILS / BLACKLIST DETAILS as two-column key/value pairs. NEGATIVES / NOT-THIS-CLASS: NOT REGISTRATION_CERTIFICATE -- that is the ISSUED Certificate of Registration (title 'CERTIFICATE OF REGISTRATION' / 'Indian Union Vehicle Registration Certificate' / 'Form 23' / 'Form 23A' with a Registering-Authority signature + round RTO seal, or a photographed/scanned plastic RC card with a chip / card-printed QR). IMPORTANT: a standalone mParivahan 'Virtual RC' app screen (phone status bar + QR + 'Return to Home') is borderline -- treat it as VAHAN_REPORT ONLY when the file is purely that portal/app/extract view; if the SAME file also contains a Form 23 / 23A 'CERTIFICATE OF REGISTRATION' page with a Registering-Authority seal, the file is REGISTRATION_CERTIFICATE, not VAHAN_REPORT. DECISIVE RULE: a digitally-rendered Vahan query/extract whose tell-tales are the red 'IP Address ... Date & Time' footer, a 'Tata Capital ... Vahan Report' title, or the 'Welcome <user>/Logout/Print/Back' + 'NR access policy' portal chrome with the VEHICLE/OWNER/HYPOTHECATION/INSURANCE/BLACKLIST DETAILS sections -- and NO issued Form 23 / 23A Certificate of Registration page anywhere in the file."
  classification_confidence_threshold: 0.85
  


- name: "DataSutram Report"
  label: "DATASUTRAM"
  group_name: "PAN - Aadhar Linking"
  description: "DataSutram-generated PAN-Aadhaar linkage report bundled into the Tata Capital onboarding flow (in this dataset a PAN-link/KYC report, not a geo report). POSITIVES (observed in samples): page-1 top-left shows 'Application ID : APPL16xxxxxxx' and 'Pan Number : <10-char PAN>'; top-right carries the red+blue 'TATA CAPITAL' logo over 'Count on us'. Below is 'Report create date: DD-MM-YYYY HH:MM'. The body is a two-column table headed 'PAN KEYS | VALUES' listing in order: PAN, VALID (Yes/No), AADHAAR NUMBER (masked XXXXXXXX####), AADHAAR LINKED (true/false), PAN TYPE (person), FULL NAME, FIRST/MIDDLE/LAST NAME, GENDER (M/F), DOB (YYYY-MM-DD), then ADDRESS BUILDING NAME / LOCALITY / STREET NAME / PINCODE / CITY / STATE / COUNTRY / MOBILE / EMAIL (these rows usually '--'). Page footer carries the distinctive 'powered by data sutram' wordmark with a teal/orange map-pin icon - the single most reliable signature. Typically 1-2 pages, page 2 blank. The 'Aadhr Pan Linking - <NAME>.pdf' filename variant uses the identical layout/footer. NEGATIVES / NOT-THIS-CLASS: NSDL_REPORT is an 'NSDL Request/Response' or 'PAN verified by NSDL' status report with the PAN Status Description code legend (D/E/EC.../N/I) and Aadhaar-seeding status table - NO 'PAN KEYS | VALUES' table and NO data-sutram footer. CKYC is a CKYC*-prefixed Fields/Values registry table with a 14-digit KIN. DIGI_KYC/OKYC are 'Digilocker Data' XML/JSON base64 dumps. CIBIL_REPORT has the TransUnion CIBIL wordmark + 3-digit score; DEDUPE_REPORT has a 'Dedupe Report' title with coloured match bands. The TATA CAPITAL header alone is NOT a discriminator (DEDUPE_REPORT also uses it). DECISIVE RULE: 'PAN KEYS | VALUES' two-column table with the 'AADHAAR LINKED true/false' row AND the 'powered by data sutram' map-pin footer."
  classification_confidence_threshold: 0.85
  


- name: "CIBIL Report"
  label: "CIBIL_REPORT"
  group_name: "CIBIL Report"
  description: "TransUnion CIBIL Consumer Credit Information Report (CONSUMER CIR). POSITIVES (observed in samples): page-1 header is the 'TransUnion CIBIL' wordmark with the 'tu' roundel logo (TransUnion blue + CIBIL grey) above a yellow horizontal 'CONSUMER CIR' banner; header block repeats on every page with CONSUMER name, MEMBER ID (e.g. NB66467777_C2C3), MEMBER REFERENCE NUMBER, DATE, TIME, CONTROL NUMBER (e.g. 6,56,49,59,511). A 'CIBIL TRANSUNION SCORE(S)' section shows a large 3-digit score (e.g. 761) under a SCORE NAME (CIBILTUSC3) with SCORING FACTORS, plus 'POSSIBLE RANGE FOR CIBIL TRANSUNION SCORE VERSION 3.0 ... 300 (high risk) to 900 (low risk)'. Fixed-order sections: CONSUMER INFORMATION, IDENTIFICATION(S) (PAN/VOTER ID/DRIVING LICENSE/UID), TELEPHONE(S), EMAIL CONTACT(S), ADDRESS(ES), PERSONAL/ENQUIRY DISPUTE(S), EMPLOYMENT INFORMATION, SUMMARY: ACCOUNT(S) (TOTAL/OVERDUE/ZERO-BALANCE/HIGH CR-SANC AMT), ENQUIRIES (PAST 30 DAYS/12/24 MONTHS), then itemised ACCOUNT(S) tradelines (MEMBER NAME: NOT DISCLOSED, TYPE: CONSUMER LOAN / CREDIT CARD / PERSONAL LOAN / AUTO LOAN / GOLD LOAN, SANCTIONED, EMI, REPAYMENT TENURE, DAYS PAST DUE buckets) and a final ENQUIRIES list ending 'END OF REPORT ON <name>'. Footer on every page: 'TransUnion CIBIL CIN : U72300MH2000PLC128359'. NEGATIVES / NOT-THIS-CLASS: NOT a Vahan/RC document (no vehicle-registration key/value table, no RTO/chassis card); NOT APPLICATION_FORM (no TATA logo, no Used Car/New Car checkboxes); NOT DATASUTRAM (no 'PAN KEYS|VALUES' table, no 'powered by data sutram' footer); NOT PERFIOS_REPORT (no Excel sheet tabs / bank-statement analytics). DECISIVE RULE: 'TransUnion CIBIL' wordmark + yellow 'CONSUMER CIR' banner + a single 3-digit credit score (300-900) with SCORING FACTORS and the 'TransUnion CIBIL CIN : U72300MH2000PLC128359' footer."
  classification_confidence_threshold: 0.85

- name: "Water Bill"
  label: "WATER_BILL"
  group_name: "OHP"
  description: "Water-supply / sewerage utility bill or water-charge receipt issued by a municipal water board (address proof). POSITIVES (observed in samples): issuer is a water/Jal authority - Delhi Jal Board ('Regular Water Bill', Consumer Category, KNO), Bangalore Water Supply and Sewerage Board (BWSSB, Water Charges + S.C for Borewell), Jalkal Vibhag / Jalkal Kanpur Nagar Nigam ('Type Of Payment: Water/Sewer Tax'), Uttarakhand Jal Sansthan / Uttarakhand Water Institute ('Water price/sewer sheet', Drinking Water), Tirupati/Kadapa Municipal Corporation 'WATER CHARGE RECEIPT' (H.S.C No). Core unit is water volume in KL / Litres / Units with Current & Previous Meter Reading; line items 'Total Consumption Charges', 'Water Charges', 'Sewerage Charge (60% of Water Consumption Charge)' / 'Water Cess' / 'Sanitary Charges', meter rent. NEGATIVES / NOT-THIS-CLASS: NOT PROPERTY_TAX_RECEIPT - even when a municipal body issues both, a water bill meters KL/Litres and is titled Water Bill / Water Charge / Water-Sewer Tax with a consumer/HSC number, whereas property tax is a multi-head tax (General/Education/Fire Tax) against an Assessment No / PID / ARV. NOT E_BILL (kWh), NOT GAS_BILL (SCM/Kg). Do NOT route a genuine water bill to UNKNOWN. DECISIVE RULE: issuer is a Jal Board / water-supply authority AND charges are for water consumption in KL/Litres with a water-consumption + sewerage line, or a 'Water Charge / Water-Sewer Tax' receipt."
  classification_confidence_threshold: 0.85
  


- name: "Property Tax Receipt"
  label: "PROPERTY_TAX_RECEIPT"
  group_name: "OHP"
  description: "Municipal property / house tax bill or payment receipt issued by a city/town municipal corporation or development authority (address proof). POSITIVES (observed in samples): issuer is a Municipal Corporation / Nagar Nigam / Mahanagarpalika or authority - Kadapa Municipal Corporation 'RECEIPT - Purpose: Property Tax', Kanpur Municipal Corporation 'HOUSE TAX BILL (गृहकर बिल)', Pune Municipal Corporation 'PROPERTY TAX BILL', Pimpri-Chinchwad Mahanagarpalika 'मालमत्ता कराचे बिल', New Town Kolkata Development Authority (NKDA) 'BILL FOR PROPERTY TAX'. Identifiers: Assessment No / PID No / UPIC ID / Property ID, Ward No, Zone No, Mohalla, Total ARV / Total RV (Annual Rateable Value). Body is a MULTI-HEAD tax list - General Tax, Education Tax, Fire Tax, Tree Tax, Water Tax, Conservancy/Sewerage Tax, Road Tax - shown as Current Year Tax / Arrear / Interest / Total Tax Payable, often quarterly. NEGATIVES / NOT-THIS-CLASS: NOT WATER_BILL - although property tax may include a 'Water Tax' head, a true WATER_BILL is a Jal-Board metered bill in KL with a consumer/HSC number; property tax is the multi-head municipal levy keyed to Assessment No/PID/ARV. NOT E_BILL (DISCOM kWh). A bundled scan may also contain a separate water/electricity page, but the property-tax page leads. DECISIVE RULE: municipal-corporation document titled Property Tax / House Tax / Gruhkar / malmatta-kar with an Assessment No / PID / UPIC ID and an ARV-based multi-head tax table."
  classification_confidence_threshold: 0.85
  


- name: "Agriculture Land Proof"
  label: "AGRICULTURE_LAND_PROOF"
  group_name: "OHP"
  description: "State revenue-department land record (Record of Rights / RoR) extract OR land-revenue rent receipt establishing that the applicant owns/holds agricultural or rural land (used as Own-House-Proof / asset proof). POSITIVES (observed in samples): a tabular land-parcel record under a state revenue masthead or NIC portal footer, varying widely by state and language but always keyed to a khata/khatauni/khewat parcel + khasra/gata/dag/plot/murabba numbers with the landholder name and a land-area figure in local units (Acre-Decimal-Hectare / Bigha / sq.ft). Observed state variants: (a) ODISHA - 'BHULEKH - LAND RECORDS WEB PORTAL OF ODISHA' / 'Khatiyan' (Schedule I Form No.39-A): Mouza, Tahasil, Thana, Jilla, Khatiyan serial no, owner/father/caste/residence, dues (Jalkar/Khajna/Cess), Plot-no & chak, Kisam, area Acre/Decimal/Hectare, red NIC footer 'ରାଷ୍ଟ୍ରୀୟ ସୂଚନା ବିଜ୍ଞାନ କେନ୍ଦ୍ର <timestamp> IP:...', 'BLANK SPACE FOR STAMPING', 'Pay Land Revenue / Print' links. (b) UTTAR PRADESH - 'भूलेख - खतौनी, राजस्व परिषद, उत्तर प्रदेश' / 'उद्धरण खतौनी (अप्रमाणित प्रति)' (upbhulekh.gov.in): Janpad/Tahsil/Gram/Gram-code, Fasli year, Khata Sankhya, Khasra/Gata no (+unique code), khatedaar details, gata area in hectare, khatedaar's bhu-rajasv, mutation (नामांतरण/वरासत) and बंधक/bank-mortgage sections, 'अप्रमाणित प्रति' watermark, NIC-Lucknow footer. (c) BIHAR - 'राजस्व एवं भूमि सुधार विभाग, बिहार - प्रपत्र-XIV ख (देखें नियम-10) - लगान रसीद' (bhulagan.bihar.gov.in): Running Unique/Receipt No, Jila/Anchal/Halka/Mauza, Jamabandi no, Khata/Khesra Sankhya, Rakba/Dismil, salana lagan + cess demand/recovery tables, QR. (d) WEST BENGAL - 'L&LR' / Bengal Form No.1077 'খাজনার দাখিলা' rent receipt and a 'Records of Rights ... under Sub-Section (2) of Section 51A of the W.B.L.R. Act, 1955' khatian: Dag no, jomir sreni/kism (বাস্তু/রপনী), area in acre, court-fee stamps (One/Four Rupees), 'ATTESTED - Revenue Officer'. (e) ASSAM - Mouzadar's-office 'খাজনা আদায়ৰ প্ৰমাণ পত্ৰ' / Patta land-revenue payment certificate (Form AGP.XXIV): Mouza, village, Patta no, 'মাটিৰ খাজনা আৰু স্থানীয় কৰ', Mouzadar seal + signature. (f) CHHATTISGARH - 'फॉर्म बी-1 किश्तबंदी खतौनी (आसामीवार)' (Bhuiyan): Gram/Halka/Ra.Ni/Tahsil/Jila, Khata kramank, bhu-swami name, area in hectare, bhu-rajasv, explicit 'स्वामित्व - भूमिस्वामी / कृषि भूमि', Document Id + QR, 'Certified to be TRUE COPY of the digitally published ROR'. (g) RAJASTHAN - 'जमाबन्दी (प्रतिलिपि) प्रपत्र पी-26 (सी) (नियम 153A)': Gram/Patwar Halka/Tehsil/Jila, Khata sankhya naya/purana, Kashtkar names with hissa & jati, Khasra sankhya, dhanrakba, bhumi vargikaran (चाही/बारानी), krishak-dwara-sandatt lagan, 'राहिन हिस्सा ... बैंक शाखा' mortgage notes, NIC logo. (h) HARYANA - jamabandi.nic.in 'Nakal' (Jamabandi): Gaon, Hadbast no, Tehsil/Jila, Saal, Khewat/Khatauni no, malik & kashtkar names, Khasra/Murabba no, rakba & kism, lagan, 'Digital ROR is available since 2002'. Forms range from clean computer-generated portal prints (NIC/timestamp/IP footers, 'अप्रमाणित प्रति / uncertified copy' watermarks) to scanned/handwritten Patwari registers with court-fee stamps; filenames are unreliable ('Khatauni', 'Khatiyan', 'Patta', 'Porcha', 'Land book', 'Jamabandi', and even misleading 'House tax challan' / 'Property Tax Receipt' which are actually land-revenue/RoR records). NEGATIVES / NOT-THIS-CLASS: NOT PROPERTY_TAX_RECEIPT - that is a Municipal Corporation / Nagar Nigam / Mahanagarpalika document keyed to an Assessment No / PID / UPIC ID with an ARV-based multi-head tax table (General/Education/Fire/Water Tax); these land records are instead keyed to khata/khasra/dag PARCELS with land AREA and land revenue (lagan/khajna), even when the filename says 'House tax' or 'Property Tax'. NOT WATER_BILL / E_BILL (no Jal-Board KL nor DISCOM kWh metering). NOT RENT_AGREEMENT / HUF_DEED / PARTNERSHIP_DEED / TRUST_DEED (those are stamp-paper deeds with party clauses + notary; a WB/Assam revenue receipt printed on court-fee stamps is still a land record, not a tenancy deed). NOT REGISTRATION_CERTIFICATE / VAHAN_REPORT (vehicle documents). DECISIVE RULE: a state revenue-department land-record extract or land-revenue receipt - Khatauni/Khatiyan/Jamabandi/Khewat (RoR) OR a Lagan/Khajna/Patta rent receipt - identified by a parcel grid of khata/khatauni/khewat + khasra/gata/dag/plot/murabba numbers, land area in Acre-Decimal-Hectare/Bigha, a kism/land-class column and the khatedaar/landholder name, under a state-government revenue masthead / Patwari-Mouzadar attestation / NIC portal footer; and NOT a municipal Assessment-No/ARV property-tax bill."
  classification_confidence_threshold: 0.85
  


- name: "Income Tax Return"
  label: "ITR"
  group_name: "Income document"
  description: "Income Tax Return acknowledgement (ITR-V) filed via the e-filing portal - most often the FIRST page of an ITR_PL_STATEMENT_BALANCE_SHEET_CA_AUDIT_REPORT_BUNDLE after page-wise split, but can arrive standalone. POSITIVES (observed in samples): title 'INDIAN INCOME TAX RETURN ACKNOWLEDGEMENT' or 'INDIAN INCOME TAX UPDATED RETURN ACKNOWLEDGEMENT' with subtitle listing ITR-1(SAHAJ)..ITR-7; top-left 'Acknowledgement Number:<15-digit>' + Date of filing; top-right 'Assessment Year' box; rows PAN, Name, Address (state-code prefix like '24-Odisha'), Status Individual, Form Number ITR-3/ITR-4, 'Filed u/s 139(1)' or '139(8A)-Updated Return'; boxed 'Taxable Income and Tax details' + 'Accreted Income & Tax Detail' (115TD/115TE); diagonal grey 'INCOME TAX DEPARTMENT' Ashoka watermark; verification footer (transmitted electronically, IP address, verified by ... Aadhaar OTP / DSC); System Generated Barcode/QR; bold-red 'DO NOT SEND THIS ACKNOWLEDGEMENT TO CPC, BENGALURU'. NEGATIVES / NOT-THIS-CLASS: a CA 'COMPUTATION OF TAX ON TOTAL INCOME' page (entity letterhead, Gross Total Income build-up, proprietor-signed) is NOT ITR despite showing Total Income - it lacks the ITR-V banner, 15-digit Ack No and CPC-Bengaluru footer. A PROFIT_LOSS_STATEMENT ('Trading & Profit & Loss A/c') or BALANCE_SHEET ('Balance Sheet as on') page is its own child. A CA_AUDIT_REPORT page is the auditor's-report narrative. FORM_16 has the TRACES masthead + quarter-wise BSR/Challan grid; SALARY_SLIP is a monthly employer payslip. DECISIVE RULE: page carries 'INDIAN INCOME TAX (UPDATED )RETURN ACKNOWLEDGEMENT' + a 15-digit Acknowledgement Number + ITR-x Form Number + the red 'DO NOT SEND THIS ACKNOWLEDGEMENT TO CPC, BENGALURU' footer under the diagonal 'INCOME TAX DEPARTMENT' watermark."
  classification_confidence_threshold: 0.85
  


- name: "CA Audited Financial"
  label: "CA_AUDIT_REPORT"
  group_name: "Financial Documents"
  description: "The Chartered Accountant's audit / attestation page - the page whose PRINCIPAL BODY IS the auditor's certification narrative itself, not the underlying financial figures. Most often one or more pages inside an ITR_PL_STATEMENT_BALANCE_SHEET_CA_AUDIT_REPORT_BUNDLE after page-wise split, but can arrive standalone. A CA firm round stamp seal (firm name + FRN, e.g. 'DHAND & CO. FRN 327662E', 'B. N. KEDIA & CO. FRN 001652N', 'SRB & Associates FRN 310009E', 'AJAY SINDHWANI & CO. FRN 015455C') with CA signature + UDIN is the hallmark - but the seal ALONE is NOT the test (it also appears on P&L and balance-sheet pages); what makes a page CA_AUDIT_REPORT is that the page CONTENT is the certification. POSITIVES (observed in samples): the page is one of - (1) an 'INDEPENDENT AUDITORS' REPORT' on a company - 'To The Members of <Company> Private Limited', 'Report on the audit of the (standalone )financial statements', Opinion / Qualified Opinion / Basis for Opinion / Key Audit Matters / Emphasis of Matter / Management's & Auditor's Responsibilities, citing Companies Act 2013 s.143(10), ICAI standards; (2) an audited-financials COVER - 'AUDITED FINANCIAL STATEMENTS OF M/S <Company> PRIVATE LIMITED / FINANCIAL YEAR 20XX-XX / AUDITORS: <CA firm>' or 'ANNUAL ACCOUNTS' cover (CIN, PAN, Incorporation Date, Directors, Auditors, Registered Office); (3) a 'DIRECTORS REPORT TO THE MEMBERS' / Director's Responsibility Statement introducing the audited set (Summarised Financial Results, Review of Business Operations, Dividend, Auditors); (4) an 'ANNEXURE-A TO INDEPENDENT AUDITORS' REPORT' (CARO clauses i-xxi); (5) a statutory tax-audit form - 'FORM 3CA' / 'FORM 3CB [See rule 6G(1)(b)] - Audit report under section 44AB of the Income-tax Act, 1961' and 'FORM 3CD [See rule 6G(2)] PART-A / PART-B', or the 'Accountant Details' / DSC page (Name, Membership Number, FRN, Date of signing Tax Audit Report, 'digitally signed by ... e-Mudhra'). NEGATIVES / NOT-THIS-CLASS: a PROFIT_LOSS_STATEMENT page ('Trading & Profit & Loss A/c' / 'Statement of Profit and Loss') or a BALANCE_SHEET page ('Balance Sheet as on ...', Notes/Annexures/Depreciation Schedule forming part of it) is classified by ITS OWN heading EVEN IF it carries the SAME CA foot-stamp - there the body is the financial statement and the seal is only a counter-attestation, whereas here the body IS the audit report/certificate. A CA 'Computation of Tax on Total Income' is not the audit report. An ITR-V ('INDIAN INCOME TAX RETURN ACKNOWLEDGEMENT' + CPC-Bengaluru footer) is ITR. A whole stitched set is the BUNDLE; this is the per-page audit child only. DECISIVE RULE: a page whose principal body is a Chartered Accountant's audit report / certificate - an Independent Auditors' Report, an audited-financials / Annual-Accounts cover, a Directors' Report, a CARO Annexure-A, or Form 3CA/3CB/3CD / the Accountant-details DSC page - the certification being the page's whole purpose; a CA stamp on a P&L or balance-sheet page does NOT make that page CA_AUDIT_REPORT."
  classification_confidence_threshold: 0.85
  


- name: "Salary Slip"
  label: "SALARY_SLIP"
  group_name: "Income document"
  description: "Single-month employer payslip issued to an employee. POSITIVES (observed in samples): title names ONE month — 'Payslip for the month of August -2025' / 'PAY SLIP', or a 'Pay Period Aug,2025' field. Header carries the EMPLOYER logo/name and address (e.g. Remine India Pvt Ltd, Sitarganj; LTIMindtree Limited, Bangalore) — never TRACES, never Income Tax Department, never a bank/NBFC as issuer. Employee identifier block: EmpCode/PsNo, Name, Branch, Department, Designation, Father Name, D.O.J, D.O.B, PF No, UAN No, ESIC No, PAN No, Aadhaar, Bank A/C No, IFSC Code, Paid Days. Body is a two-column ledger: left 'Earnings' (BASIC, House Rent Allowance, Conveyance, Special, Incentive Pay, Adhoc/Car/Shift Allowance) with a current-month Amount column (LTIMindtree adds Arrear/Adj and an Annual Salary projection); right 'Deductions' (Provident Fund/PF, Income Tax/TDS, Professional Tax, Group Term Life Insurance). Closes with Gross Earning, Gross Deduction, Net Amount / Net Pay(INR) and 'Net Pay in words'. NEGATIVES / NOT-THIS-CLASS: FORM_16 covers a whole financial year (FORM 16 title, section 203, Assessment Year, Deductor TAN, quarter-wise BSR/Challan grid, TRACES masthead). SALARY_CERTIFICATES is a single consolidated 'To Whomsoever It May Concern' employment letter, not a monthly earnings/deductions table. ITR is the e-filed return acknowledgement. BANK_STATEMENT/SOA are account ledgers. DECISIVE RULE: employer-branded document titled 'Payslip / Pay Slip for the month of <Month> <Year>' (or a single Pay Period), whose body is a single-period Earnings-vs-Deductions table ending in Net Pay."
  classification_confidence_threshold: 0.85
  


- name: "Form 16"
  label: "FORM_16"
  group_name: "Income document"
  description: "Annual TDS-on-salary certificate issued under section 203 of the Income-tax Act, 1961. POSITIVES (observed in samples): title 'FORM 16' / 'FORM NO. 16' (sometimes '(B)') with subtitle '[See rule 31(1)(a)]' and 'Certificate under section 203 of the Income-tax Act, 1961 for Tax deducted at source on Salary'; PART A and/or PART B (Annexure) headers. Identifier grid: Name and address of the Employer (deductor), Name and designation of the Employee, PAN of the Deductor, TAN of the Deductor (e.g. BBNS02597A), PAN of the Employee (e.g. AELPN5249R), CIT(TDS), Assessment Year (e.g. 2020-21, 2022-23), Period From/To. Part A is the quarter-wise 'Summary of amount paid/credited and tax deducted at source' with TRACES Receipt Numbers and a 'DETAILS OF TAX DEDUCTED AND DEPOSITED ... THROUGH BOOK ADJUSTMENT/CHALLAN' table (BSR Code, Challan Serial No). Part B lists Gross Salary 17(1), Section 10 exemptions, Section 16 deductions, Income chargeable under 'Salaries', Chapter VI-A 80C/80D/80CCD, Total taxable income, Tax payable, Health & education cess, with a Verification/Signature block. Often a TRACES masthead ('TDS-CPC' / 'TRACES — TDS Reconciliation Analysis and Correction Enabling System' / Income Tax Department emblem) and a 'Signature Not Verified — Digitally signed' footer; some scans are rotated and show only the FORM 16 form body without the masthead. NEGATIVES / NOT-THIS-CLASS: SALARY_SLIP covers ONE month, is employer-payroll-branded, and is an Earnings-vs-Deductions->Net Pay table with no Assessment Year / no TAN / no quarter-wise Challan grid. ITR is the taxpayer-filed 'INDIAN INCOME TAX RETURN ACKNOWLEDGEMENT' (Acknowledgement No, ITR-1/2/3/4, 'DO NOT SEND THIS ACKNOWLEDGEMENT TO CPC, BENGALURU' red footer). DECISIVE RULE: 'FORM 16 / FORM NO. 16' + 'section 203 of the Income-tax Act' + Assessment Year + Deductor TAN + Deductee PAN (or a TRACES masthead with PART A/PART B)."
  classification_confidence_threshold: 0.85
  


- name: "Salary Certificate"
  label: "SALARY_CERTIFICATES"
  group_name: "Income document"
  description: "Employer-issued consolidated salary / employment certificate - a 'To Whomsoever It May Concern' attestation letter, NOT a monthly payslip. POSITIVES (observed in samples): a single-page letter on the EMPLOYER's letterhead (firm / proprietor name + address + contact, e.g. 'SRI GAYATHRI TRANSPORT', 'Pro: <name>', Cell no) with a centred title 'SALARY CERTIFICATE' (or 'TO WHOMSOEVER IT MAY CONCERN'); a certifying paragraph 'This is to certify that Mr/Mrs <Name> S/o <Father> is working with <Employer> from <date> to till date as a permanent employee and his current designation is <role> ...' that states the salary amount in prose (e.g. 'salary has been given 30000/- cash by hand') plus any allowances (travel/DA); frequently a small month-wise table (Month / Salary / Travel Allowance) for the last few months; closes 'For <Employer>' with a Proprietor / Authorised Signatory signature and stamp and an issue Date. Often issued by small proprietor firms for self-employed-style or informal-payroll borrowers who lack formal payslips. NEGATIVES / NOT-THIS-CLASS: NOT SALARY_SLIP - a payslip names exactly ONE month ('Payslip for the month of <Month> <Year>') and is a structured two-column Earnings-vs-Deductions ledger ending in Net Pay, with EmpCode/PF/UAN/PAN/Bank-A/C identifiers; a salary certificate is a narrative employment-and-pay attestation letter, not an earnings/deductions grid. NOT FORM_16 (TRACES masthead, Assessment Year, Deductor TAN, quarter-wise BSR/Challan grid). NOT ITR / BANK_STATEMENT / SOA. NOT WORK_ORDER_AGREEMENT (a contract awarded to a contractor, not an employee pay attestation). DECISIVE RULE: an employer-letterhead certificate titled 'Salary Certificate' (or a 'To Whomsoever It May Concern' employment letter) that certifies an employee's name, designation, tenure and salary in prose - NOT a month-column Earnings/Deductions payslip."
  classification_confidence_threshold: 0.85
  


- name: "Statement of Account"
  label: "SOA"
  group_name: "RTR"
  description: "Lender/NBFC LOAN-account statement (not a deposit account). POSITIVES (observed in samples): issuer is a lender desk — BAJAJ FINANCE LIMITED ('STATEMENT OF ACCOUNT FOR <Loan-App-ID>'), IDFC FIRST Bank ('Account Statement' with Agreement No), ICICI Bank ('Loan Account Statement for <LOAN-ID>'). Header is a key/value loan block (often paired CUSTOMER DETAILS + LOAN ACCOUNT DETAILS) carrying loan-only fields: Loan Amount, Rate of Interest Per Annum, Interest Rate Type Fixed/Floating, Loan Tenure (In Months), Instalment/EMI Amount, Loan Creation/Sanction Date, Interest Start Date, First Instalment Due Date, Instalment Repayment End Date, Outstanding Loan Amount (Principal+Interest), Future Principal/Interest Component, Future Instalment Number, Loan Status, Product Type ('SALARIED FLEXI LOAN','PRE-QUALIFIED LOAN','PERSONAL LOAN'). A LOAN FINANCIAL SUMMARY breaks Particulars into Due/Received/Waived/Overdue. The transaction grid has 'Disbursement Amount Paid Online', 'STAMP DUTY/PROCESSING FEE Deducted From Loan Amount', and repeating fixed-amount rows 'Due for Instalment No. N (EMI - X, Principal - X, Interest - X)' / 'Due For Instalment N' + 'Amount Received for Instalment'. NEGATIVES / NOT-THIS-CLASS: BANK_STATEMENT is a deposit ledger with mixed UPI/NEFT/IMPS narrations and no fixed-EMI rows or Sanction/Tenure header — note a bank-branded SOA (IDFC/ICICI) may title itself merely 'Account Statement', so rely on the loan header + instalment rows, NOT the title. PERFIOS_REPORT is an Excel analytics workbook. FINBOX is a 'WORKFLOW EVALUATION REPORT'. DECISIVE RULE: statement whose header carries Sanction/Creation Date + Rate of Interest + Tenure(Months) + EMI/Instalment Amount AND whose body has repeating 'Due for Instalment No. N' rows with fixed EMI/Principal/Interest."
  classification_confidence_threshold: 0.85
  


- name: "Profit and Loss Statement"
  label: "PROFIT_LOSS_STATEMENT"
  group_name: "Financial Documents"
  description: "The Profit & Loss / income-statement page of a firm's or company's accounts - most often one page inside an ITR_PL_STATEMENT_BALANCE_SHEET_CA_AUDIT_REPORT_BUNDLE after page-wise split, but can arrive standalone. THE DECIDING SIGNAL IS THE HEADING + an income-vs-expense body resolving to Net Profit/Loss, NOT the presence or absence of a CA stamp - in these bundles the P&L page FREQUENTLY carries a CA round FRN seal, UDIN and signature and is STILL PROFIT_LOSS_STATEMENT. POSITIVES (observed in samples): a heading - 'TRADING & PROFIT & LOSS A/C FOR THE YEAR ENDED ON 31/03/YYYY' (S.S. Textiles), 'PROFIT & LOSS ACCOUNTS FOR THE YEAR 2022-2023 OF M/S ... PROP- ...' (Shibani Travels), 'Statement of Profit and Loss for the year ended March 31, YYYY'. Two layouts: (a) T-account - left/debit 'To Opening Stock / To Purchases / To Audit Fees / To Salary / To Depreciation / To Net Profit Transferred To Prop. Capital Account' vs right/credit 'By GST Sales / By Closing Stock / By Gross Profit B/D / By Interest Received', Debit Total = Credit Total; or (b) vertical Schedule-III - Revenue from Operations, Other Income, Cost of Material Consumed, Changes in Inventory, Employee Benefit Expenses, Finance Costs, Depreciation, Other Expenses, Profit Before/After Tax, EPS, prior-year column. Often 'As per our report of even date' + CA sign-off (FRN, M.No, UDIN) + proprietor/director signature. NEGATIVES / NOT-THIS-CLASS: a BALANCE_SHEET page is headed 'Balance Sheet as on / as at ...' and lists Liabilities vs Assets (a position snapshot); a Cash Flow Statement and Notes/Annexures travel with the balance sheet, not here. A CA_AUDIT_REPORT page's PRINCIPAL body is the auditor's certification narrative (Independent Auditors' Report opinion, Form 3CA/3CB/3CD) - on a P&L page the body IS the income/expense ledger and any CA seal is only a foot attestation, so a CA stamp does NOT make it CA_AUDIT_REPORT. An ITR-V shows 'Total Income' but carries the 'INDIAN INCOME TAX RETURN ACKNOWLEDGEMENT' banner + CPC-Bengaluru footer. A whole stitched audited set is the BUNDLE, not this single child. DECISIVE RULE: a page headed 'Trading & Profit & Loss A/c' / 'Profit & Loss Account' / 'Statement of Profit and Loss' / 'Income Statement' whose body is an income-vs-expenditure statement resolving to Net Profit/Loss - regardless of any CA counter-signature."
  classification_confidence_threshold: 0.85
  


- name: "Balance sheet"
  label: "BALANCE_SHEET"
  group_name: "Financial Documents"
  description: "The Balance Sheet page of a firm's or company's accounts - a position snapshot of what the entity owns and owes AS ON a date. Most often one page inside an ITR_PL_STATEMENT_BALANCE_SHEET_CA_AUDIT_REPORT_BUNDLE after page-wise split, but can arrive standalone. THE DECIDING SIGNAL IS THE HEADING + a Liabilities-vs-Assets (or Equity & Liabilities vs Assets) body that totals equal, NOT the presence or absence of a CA stamp - in these bundles the Balance Sheet page FREQUENTLY carries a CA round FRN seal, UDIN and signature and is STILL BALANCE_SHEET. POSITIVES (observed in samples): heading 'BALANCE SHEET AS ON 31/03/YYYY OF M/S ...' (Shibani Travels, S.S. Textiles) or 'BALANCE SHEET AS AT 31st MARCH, YYYY' (Ori Ventures / Vardhaman Autowheels Pvt Ltd) or 'Statement of Assets and Liabilities'. Two layouts: (a) T-form - left 'LIABILITIES' (Capital / Proprietor's Capital, Secured Loans, Current Liabilities & Provisions, Unsecured Loans, often tagged 'As per Annexure-N attached') vs right 'ASSETS' (Fixed Assets, Closing Stock, Sundry Debtors, Investment, Loans & Advances, Cash & Bank Balance), Liabilities TOTAL = Assets TOTAL; or (b) vertical Schedule-III - 'EQUITY AND LIABILITIES' (Share Capital, Reserves & Surplus, Borrowings, Trade Payables) then 'ASSETS' (PP&E/Fixed Assets, Inventories, Trade Receivables, Cash & Cash Equivalents), note refs + prior-year column. Pages that EXPLICITLY FORM PART OF the balance sheet also belong here: 'ANNEXURES / NOTES FORMING PART OF THE BALANCE SHEET' (Proprietor's Capital, Secured/Unsecured Loans, Sundry Creditors, Provisions, Share Capital reconciliation, PP&E/Depreciation schedule, payable/receivable ageing) and the standalone 'Depreciation Schedule'. Often 'As per our report of even date' + CA sign-off + signature. NEGATIVES / NOT-THIS-CLASS: a PROFIT_LOSS_STATEMENT page is headed 'Trading & Profit & Loss A/c' / 'Statement of Profit and Loss' showing an income-vs-expenditure flow to Net Profit/Loss (a period flow, not an as-on-date position); a Cash Flow Statement is not the balance-sheet heading. A CA_AUDIT_REPORT page's PRINCIPAL body is the auditor's certification narrative - on a Balance Sheet page the body IS the assets/liabilities statement and any CA seal is only a foot attestation, so a CA stamp does NOT make it CA_AUDIT_REPORT. An ITR-V carries the 'INDIAN INCOME TAX RETURN ACKNOWLEDGEMENT' banner + CPC-Bengaluru footer. A whole stitched audited set is the BUNDLE, not this single child. DECISIVE RULE: a page headed 'Balance Sheet as on / as at <date>' (or 'Statement of Assets and Liabilities') whose body is a Liabilities/Equity-vs-Assets position statement totalling equal - or a schedule/annexure/depreciation chart that explicitly forms part of that balance sheet - regardless of any CA counter-signature."
  classification_confidence_threshold: 0.85
  


- name: "Manual IBB"
  label: "MANUAL_IBB"
  group_name: "IBB Report"
  description: "Indian Blue Book (IBB) used-vehicle valuation 'price check' printout generated from the Tata Capital / Jocata-FinnOne underwriting system - a manual on-screen valuation lookup captured to PDF. POSITIVES (observed in samples): a page titled 'CHECK IBB PRICE' containing a 'Price Check' form - a 'Price Check For' radio set (Trade-In / Private / Retail / CPO) followed by dropdown / entry fields Location (city or RTO, e.g. COIMBATORE, CHENNAI), Manufacture Year, Manufacture Month, Make (MARUTI SUZUKI, HYUNDAI), Model, Variant, Colour, Kilometer, Owner (1/2/3) each with a green tick marker, plus Submit / Reset buttons and a 'Credit limit : <n>' line. Below the form a bold blue results header concatenates 'MAKE MODEL VARIANT - Colour - Month Year - LOCATION', and a 'Price Check Result As On - <date>' block lists Fair Price / Market Price / Best Price in rupees. The leading page is frequently blank; every page carries vertical 'SSO-JOCATA' and 'SSO-FinnOne | DD/MM/YYYY HH:MM:SS' watermark banners. Filenames are typically 'APPL16xxxxxxx' or 'APPL16xxxxxxx - IBB.pdf'. NEGATIVES / NOT-THIS-CLASS: NOT VAHAN_REPORT / REGISTRATION_CERTIFICATE - those carry the vehicle's Registration No / Chassis / Engine / Owner-serial pulled from the RTO record, not a Fair/Market/Best valuation produced from Make/Model/Year/Km inputs. NOT APPLICATION_FORM (the TATA 'NEW CAR/USED CAR LOAN APPLICATION FORM' with Used/New Car checkboxes and applicant/income/vehicle/reference grids). NOT SYSTEM_DATA (a 'Field Name | Values' applicant data extract). DECISIVE RULE: a 'CHECK IBB PRICE' price-check page with the Trade-In/Private/Retail/CPO selector + Make/Model/Variant/Year/Kilometer/Owner inputs AND a Fair / Market / Best Price result table, under the SSO-JOCATA / SSO-FinnOne watermark."
  classification_confidence_threshold: 0.85
  


- name: "Invoice"
  label: "PERFOMA_INVOICE"
  group_name: "Asset Documents"
  description: "Vehicle dealer's Proforma Invoice / price quotation issued to the applicant for the car/vehicle being financed — a pre-sale costing sheet, NOT a final tax invoice and NOT the IBB valuation. POSITIVES (observed in samples): top-of-page AUTHORISED DEALER letterhead (dealer name + 'AUTHORIZED <OEM> DEALER', e.g. 'SAI SERVICE PRIVATE LTD (Authorized Maruti-Suzuki Dealer)', 'MITTAL AUTOZONE', 'Unnati Motors (Mahindra)') with the dealer address, the dealer GSTIN (e.g. 18ABACS4934R1ZN) and an invoice Sr./Sl. No.; centred title 'PROFORMA INVOICE' / 'PERFORMA INVOICE' / 'QUOTATION'; a 'To,' block with the customer name + address and the vehicle 'MODEL' / Variant-Suffix / Colour (e.g. 'MARUTI FRONX DELTA+', 'MARUTI TOUR H2'). The core is a price break-up table — rows such as Ex-Showroom (price), Discount / Consumer Offer, Ex-Showroom after Discount, RTO Charges (Individual/Corporate), Insurance, Fast-Tag, No. Plate, Extended Warranty / RSA, TCS, Accessories, and a bold 'TOTAL ON ROAD' / Total. Footer reads like a quotation — 'This is proforma and not a sale bill', 'Prices prevailing at the time of invoicing will be applicable', delivery subject to availability, documents required for booking (PAN/Aadhaar) — and carries the dealer's RTGS/Bank details (A/c No., IFSC) in favour of the dealer plus an 'Authorised Signatory' seal/signature; a vertical 'SSO-FinnOne | <ref> | <timestamp>' side-watermark often runs down the page. NEGATIVES / NOT-THIS-CLASS: NOT MANUAL_IBB / DEALER_IBB (Indian Blue Book vehicle-valuation reports with a 'CHECK IBB PRICE' selector and a Fair/Market/Best value for used-car valuation, not a dealer price quote). NOT REGISTRATION_CERTIFICATE / VAHAN_REPORT (registration data of an already-registered vehicle). NOT APPLICATION_FORM (the TATA Capital loan application). NOT a final GST Tax Invoice / sale bill. DECISIVE RULE: an authorised vehicle-dealer document titled 'Proforma Invoice' / 'Performa Invoice' / 'Quotation' addressed to the customer for a specific vehicle MODEL with an Ex-Showroom → RTO → Insurance → TOTAL ON ROAD price break-up and 'proforma / not a sale bill' wording."
  classification_confidence_threshold: 0.85
  


- name: Articles of Association
  label: AOA
  group_name: Constitution Documents
  description: "Articles of Association (AOA) - a company's internal governance rulebook standing ALONE in the file. POSITIVES (observed in samples): a run headed 'ARTICLES OF ASSOCIATION OF <COMPANY> PRIVATE LIMITED / LIMITED' beneath 'THE COMPANIES ACT 1956/2013' / 'COMPANY LIMITED BY SHARES'; opens with INTERPRETATION/definitions ('the Act', 'the Seal'), adoption/exclusion of Table F (2013) or Table A (1956); numbered article clauses - PRIVATE COMPANY restrictions, SHARE CAPITAL AND VARIATION OF RIGHTS, LIEN, CALLS, TRANSFER and TRANSMISSION, FORFEITURE, ALTERATION OF CAPITAL, BUYBACK, BORROWING POWERS, GENERAL MEETINGS, Voting, BOARD OF DIRECTORS, Managing Director, COMMON SEAL, DIVIDENDS AND RESERVES, ACCOUNTS, AUDIT, WINDING UP, INDEMNITY; closes with a subscriber table 'in pursuance of these Articles of Association'. SPICe e-AOA variant: a 'FORM NO. INC-34 / SPICe AOA' Article-No./Description grid with 'Table F ... applicable to the company'. NEGATIVES / NOT-THIS-CLASS: if the SAME file ALSO carries a 'Memorandum of Association of <CO>' charter run (Name / Registered Office State / Objects / Liability / Capital clauses) it is MOA_AOA_COI_BUNDLE (split page-wise), NOT a lone AOA - many files named 'AOA -' actually start with or also contain the MOA, so verify all pages. MOA is the external charter (Name/Objects/Capital); COI is the one-page RoC certificate. DECISIVE RULE: file headed 'Articles of Association of <Company>' whose body is numbered internal-governance article clauses (Table F, Share Capital, Board, Lien, Meetings, Common Seal), AND containing NO Memorandum Name/Objects/Liability/Capital charter run (if the Memorandum also appears -> MOA_AOA_COI_BUNDLE)."
  classification_confidence_threshold: 0.85
  


- name: Memorandum of Association
  label: MOA
  group_name: Constitution Documents
  description: "Memorandum of Association (MOA) - a company's external charter standing ALONE in the file. POSITIVES (observed in samples): a run headed 'MEMORANDUM OF ASSOCIATION OF <COMPANY> PRIVATE LIMITED / LIMITED' beneath 'THE COMPANIES ACT 1956/2013' / 'COMPANY LIMITED BY SHARES'; the five charter clauses - I. Name ('The name of the Company is <CO>'), II. Registered Office ('situated in the State of <STATE>'), III. Objects (long numbered 'To carry on / To...' object sub-clauses + 'incidental or ancillary'), IV. Liability ('liability of the member(s) is limited'), V. Capital ('Authorised Share Capital is Rs. ... divided into ... equity shares of Rs. ... each'); closes with the subscriber table 'We, the several persons whose names ... are subscribed ... desirous of being formed into a company in pursuance of this Memorandum of Association' with names/addresses, No. of shares, signatures, witness. NEGATIVES / NOT-THIS-CLASS: if the SAME file ALSO carries an 'Articles of Association of <CO>' governance run (Table F, Board of Directors, Lien, General Meetings, Common Seal article clauses) it is MOA_AOA_COI_BUNDLE (split page-wise), NOT a lone MOA - this co-occurrence is the commonest mislabel (files named 'MOA -' often contain BOTH). AOA is the internal-governance counterpart (no Name/Objects/Capital clauses); COI is the one-page RoC incorporation certificate. DECISIVE RULE: file headed 'Memorandum of Association of <Company>' with the Name/Registered-Office/Objects/Liability/Capital clauses and a 'formed into a company' subscriber table, AND containing NO Articles-of-Association governance article run (if Articles also appear -> MOA_AOA_COI_BUNDLE)."
  classification_confidence_threshold: 0.85
  


- name: Certificate of Incorporation
  label: COI
  group_name: Constitution Documents
  description: "Certificate of Incorporation (COI) - the RoC incorporation-certificate page; a layer-2 child of MOA_AOA_COI_BUNDLE (a constitution file is routed to MOA_AOA_COI_BUNDLE at layer 1, then this certificate page is labelled COI when split). POSITIVES (observed in samples): a single certificate page (often in an ornate starflower/asterisk border) with the Ashoka emblem and masthead 'GOVERNMENT OF INDIA / MINISTRY OF CORPORATE AFFAIRS / Central Registration Centre' (older variants: bilingual Hindi, 'Form 1' / handwritten 'Form I.R.'); centred title 'Certificate of Incorporation'; the sentence 'I hereby certify that <COMPANY> PRIVATE LIMITED is incorporated on this <date> under the Companies Act, 2013 ... and that the company is limited by shares'; the CIN 'U#####<ST>####PTC######'; often company PAN and TAN; 'Given under my hand at <city>'; Registrar of Companies digital signature + round seal; a 'Mailing Address as per record' footer. NEGATIVES / NOT-THIS-CLASS: a COI page is ONLY the certificate - it carries NONE of the Memorandum charter clauses (Name / Objects / Liability / Capital -> MOA) and NONE of the Articles governance clauses (Table F, Board of Directors, Lien, Common Seal, Winding Up -> AOA). It is never PARTNERSHIP_DEED / TRUST_DEED / HUF_DEED. DECISIVE RULE: a page bearing the title 'Certificate of Incorporation' + a CIN/LLPIN + 'I hereby certify that <CO> is incorporated' = COI."
  classification_confidence_threshold: 0.85
  


- name: Partnership Deed
  label: PARTNERSHIP_DEED
  group_name: Constitution Documents
  description: "Partnership Deed (or Reconstituted Partnership Deed) - a stamp-paper agreement constituting a PARTNERSHIP FIRM of two or more partners. POSITIVES (observed in samples): non-judicial e-Stamp first page ('INDIA NON JUDICIAL', Government of <STATE>, e-Stamp, Certificate No. IN-<ST>########, 'Description of Document: Article 40(A) Partnership' or 'PARTNERSHIP DEED', First Party / Second Party); title 'DEED OF PARTNERSHIP' / 'PARTNERSHIP DEED' / 'THIS DEED OF PARTNERSHIP WITNESSETH'; a partner table (No. / Name / Age (Major) / Address / Occupation / 'The First Partner of the Party of the First Part' etc.); 'WHEREAS the parties have decided to carry on business in partnership under the name and style M/s <FIRM>'; numbered clauses NAME OF FIRM, DURATION ('AT WILL'), PLACE/NATURE OF BUSINESS, CAPITAL CONTRIBUTION, PROFIT/LOSS SHARING RATIO, admission/retirement/dissolution; partner + witness signatures. NEGATIVES / NOT-THIS-CLASS: vs TRUST_DEED - a Partnership Deed is a PROFIT firm of partners with capital contributions and a profit/loss-sharing ratio; NO settlor/trustee/beneficiary, NO trust corpus/property-settlement, NO Society 'Managing Committee / General Body / President-Secretary / BYELAWS', NO 'Indian Trusts Act 1882' or 'Societies Registration Act / Registrar of Societies'. vs MOA/AOA/COI - those constitute a COMPANY (Registrar of Companies, CIN, share capital, Memorandum/Articles), not a firm. vs HUF_DEED - a Karta + coparceners family, not profit-sharing partners. DECISIVE RULE: stamp-paper deed titled 'Partnership / Deed of Partnership' naming two or more PARTNERS with a firm name 'M/s ...', capital contributions and a PROFIT-SHARING RATIO plus admission/retirement/dissolution clauses - and NO trustee/settlor/Society/Managing-Committee or company/CIN content."
  classification_confidence_threshold: 0.85
  


- name: "Fleet List"
  label: "FLEET_LIST"
  group_name: "Fleet List"
  description: "Self-declared list of commercial vehicles owned / operated by a fleet operator or transport business (asset & relationship proof for fleet-funding applicants). POSITIVES (observed in samples): a single-page tabular vehicle inventory headed by the fleet owner / applicant name (and residential address) OR by a transport-firm letterhead (e.g. 'BABA Travels', address + contact, proprietor stamp). The core is a 'VEHICLE FLEET' grid whose columns are Sl.No / Owner Name / Asset (Make, e.g. MARUTI, HYUNDAI, KIA, TOYOTA, FORCE) / Model (TOUR H2, EON, CARENS, INNOVA CRYSTA, TRAVELLER) / 'Financed or Free' / 'Financed from' (the financier or bank - ICICI BANK, UNION BANK OF INDIA, MAHINDRA & MAHINDRA FINANCE, YES BANK, SBI; 'NA' when free) / RC Number (state-RTO registration numbers such as WB07J7044, UP65FE0782). Appears either as a clean computer-generated table with the owner name+address banner on top, or as a scanned firm letterhead with a handwritten/proprietor signature and stamp ('वास्ते <firm> ... प्रोप्राइटर'); some carry the SSO-FinnOne side watermark. NEGATIVES / NOT-THIS-CLASS: NOT REGISTRATION_CERTIFICATE / VAHAN_REPORT - those describe exactly ONE vehicle drawn from the RTO record (Chassis/Engine/Owner-serial, RTO seal or Vahan extract); a Fleet List enumerates MULTIPLE vehicles with a 'Financed or Free' / 'Financed from' column and no per-vehicle RTO chrome. NOT MANUAL_IBB (a single-vehicle Fair/Market/Best price valuation). NOT BANK_STATEMENT / SOA / APPLICATION_FORM. DECISIVE RULE: an owner- or transport-firm-headed multi-row table listing several vehicles by Make/Model + RC/registration number with a 'Financed or Free' and 'Financed from' (financier) column - a fleet inventory, not a single RTO certificate or valuation."
  classification_confidence_threshold: 0.85
  


- name: "Work Order Agreement"
  label: "WORK_ORDER_AGREEMENT"
  group_name: "Contract Letter"
  description: "Work order / contract / Letter of Acceptance that AWARDS a job or supply contract to the applicant (a contractor or self-employed service provider) - used as business-income / business-relationship proof. POSITIVES (observed in samples), two shapes: (a) PRIVATE contractor work-order letter on the issuer's letterhead (e.g. 'M/S. SRICHARAN PRADHAN - Civil & Electrical Work Service Provider', with GSTIN/PAN), addressed 'To: Mr <Name>', a 'Sub: ... Work Order for ...' subject line, a body 'As discussed ... I am pleased to place an order of the work ... for an amount of Rs. <amt> (Rupees ... Only) subject to the following conditions', numbered Terms & Conditions (material supply, milestone payment %), a 'Yours Truly / Authorised Signatory / Proprietor' signature, and an ANNEXURE with an Item Description / Unit / Qty / Rate / Amount BOQ totalling the order value plus a 'Received & Accepted by <name>' counter-signature. (b) GOVERNMENT / PSU tender 'Letter Of Acceptance' (e.g. East Central Railway, DRM/Divisional office) with a Letter No & Date, addressee firm 'M/s <Name>', 'Sub: Letter Of Acceptance', references to the Tender No / closing date / bid ID, the accepted total contract value in Rs (words + figures), Earnest Money / Security Money / Performance Guarantee clauses citing GCC-2022, completion period, a digitally-signed officer (Sr.DEN), and 'Awarded Quantities And Rates' / 'Item Breakup' schedules (Schedule, Item No/Code, Qty, Unit Rate, Amount per BOQ). NEGATIVES / NOT-THIS-CLASS: NOT a Purchase Invoice / Tax Invoice / SOA / BANK_STATEMENT (those record completed sales or payments, not a forward order placement). NOT SALARY_CERTIFICATES (an employee employment-and-pay attestation, not a contract award to a vendor/contractor). NOT PARTNERSHIP_DEED / MOA_AOA_COI_BUNDLE (firm/company constitution deeds). DECISIVE RULE: a letter or document that AWARDS work or supply to a named party - titled or subject-lined 'Work Order' / 'Letter Of Acceptance' / 'Contract' - placing an order for a stated contract value with Terms & Conditions and a BOQ/annexure of items-rates-amounts, signed by the awarding party (and often counter-accepted by the awardee)."
  classification_confidence_threshold: 0.85
  



#Bundled classes
- name: "CA Audited Financial Bundle"
  label: "ITR_PL_STATEMENT_BALANCE_SHEET_CA_AUDIT_REPORT_BUNDLE"
  group_name: "Financial Documents"
  description: "A single uploaded file that STITCHES TOGETHER TWO OR MORE distinct sub-documents of a proprietorship / firm / company applicant's CA-prepared financial set - deciding signal is CO-OCCURRENCE of multiple sub-documents in ONE multi-page file (observed 5-34 pages), NOT any single statement alone. This is a CONTAINER, NOT a final label: when detected it MUST be SPLIT PAGE-WISE and each page re-classified into a child - ITR / PROFIT_LOSS_STATEMENT / BALANCE_SHEET / CA_AUDIT_REPORT; the bundle has no extraction_class. POSITIVES (observed in samples): the file interleaves several of - (1) ITR-V ('INDIAN INCOME TAX (UPDATED )RETURN ACKNOWLEDGEMENT', 15-digit Ack No, ITR-3/ITR-4, red 'DO NOT SEND...TO CPC, BENGALURU' footer); (2) CA 'COMPUTATION OF TAX ON TOTAL INCOME'; (3) Trading & P&L - 'TRADING & PROFIT & LOSS A/C FOR THE YEAR ENDED ON 31/03/YYYY' (T-account) or 'Statement of Profit and Loss for the year ended'; (4) Balance Sheet - 'BALANCE SHEET AS ON / AS AT 31/03/YYYY' (Liabilities vs Assets, or EQUITY AND LIABILITIES vs ASSETS) plus ANNEXURES/Notes/Depreciation Schedule forming part of it; (5) Audit set - cover 'AUDITED FINANCIAL STATEMENTS OF M/S ...' or 'ANNUAL ACCOUNTS' (CIN/PAN/Directors/Auditors), 'INDEPENDENT AUDITORS' REPORT', 'DIRECTORS REPORT TO THE MEMBERS', Annexure-A (CARO), Form 3CA/3CB/3CD. Real bundles observed: AUDIT 22-23 (cover+auditors report+CARO+balance sheet+P&L+cash flow+notes), Shibani (ITR-V+balance sheet+P&L+depreciation+tax computation), 'Balance Sheet (1)' (P&L+balance sheet+annexures); CA round FRN/UDIN stamps recur throughout. NEGATIVES / NOT-THIS-CLASS: if the file contains ONLY ONE sub-document standing alone, classify it as that leaf instead - lone ITR-V -> ITR; lone Trading/P&L (even with CA foot-stamp+annexures) -> PROFIT_LOSS_STATEMENT; lone Balance Sheet+schedules -> BALANCE_SHEET; lone Independent Auditors' Report / audited-financials cover / Form 3CB-3CD -> CA_AUDIT_REPORT (observed single-component files: AR_ORI=audit report only, BS_ORI=balance sheet only, PL_ORI and 'P and L Acct'=P&L only, ITR_11 and ITR.pdf=ITR-V only). FILENAMES LIE - 'Balance Sheet (1)' and 'AUDIT' files were full multi-doc bundles while 'AR_ORI'/'BS_ORI'/'PL_ORI' were single components; judge by PAGE CONTENT, not name. FORM_16 (TRACES), SALARY_SLIP, BANK_STATEMENT/SOA, PERFIOS_REPORT, and the company-constitution MOA_AOA_COI_BUNDLE are never this bundle. DECISIVE RULE: ONE file that stitches together TWO OR MORE of {ITR-V acknowledgement, CA Computation, Trading & P&L, Balance Sheet + schedules, Form 3CA/3CB+3CD or Independent Auditors' Report / audited-financials cover} - co-occurrence of multiple sub-documents - as opposed to any single one alone."
  classification_confidence_threshold: 0.85

- name: "MOA, AOA and COI Bundle"
  label: "MOA_AOA_COI_BUNDLE"
  group_name: "Constitution Documents"
  description: "CONTAINER / layer-1 ROUTING category (not a final leaf): the catch-all for ANY company INCORPORATION / CONSTITUTION document - a Certificate of Incorporation (COI), a Memorandum of Association (MOA), and/or an Articles of Association (AOA) - whether the file holds just ONE of them or several stitched together (observed 1-44 pages). When detected it is SPLIT PAGE-WISE at layer 2 and each page/run is re-classified into a child - COI / MOA / AOA (a lone certificate yields a single COI child; a full set yields COI+MOA+AOA). CRITICAL: COI, MOA and AOA are NOT standalone layer-1 classes - they exist ONLY as children of this category - so EVERY constitution document, INCLUDING a single-page Certificate of Incorporation on its own, MUST be classified here at layer 1; never leave such a file as UNKNOWN. POSITIVES (observed in samples): one OR more of - (a) a single-page RoC 'Certificate of Incorporation' (Ashoka emblem + 'GOVERNMENT OF INDIA / MINISTRY OF CORPORATE AFFAIRS / Central Registration Centre', 'I hereby certify that <CO> PRIVATE LIMITED is incorporated ... under the Companies Act, 2013', CIN 'U#####<ST>####PTC######', company PAN/TAN, 'Given under my hand at <city>', Registrar of Companies digital signature + round seal, 'Mailing Address as per record' footer); (b) a 'MEMORANDUM OF ASSOCIATION OF <CO> PRIVATE LIMITED' run (THE COMPANIES ACT 1956/2013, COMPANY LIMITED BY SHARES; I Name / II Registered Office State / III Objects To-clauses / IV Liability / V Authorised Share Capital; 'desirous of being formed into a company' subscriber table); (c) an 'ARTICLES OF ASSOCIATION OF <CO>' run (INTERPRETATION, Table F adoption, Share Capital, Lien, Calls, Transfer/Transmission, Board of Directors, Common Seal, Dividends, Winding Up, Indemnity article clauses; 'these Articles of Association' subscriber table). May carry a boxed/starflower-bordered 'MEMORANDUM AND ARTICLES OF ASSOCIATION OF <CO>' cover; page numbers often restart between the COI cover, the MOA half and the AOA half. NEGATIVES / NOT-THIS-CLASS: NOT the CA financial bundle (ITR / Computation / P&L / Balance Sheet / Audit Report -> ITR_PL_STATEMENT_BALANCE_SHEET_CA_AUDIT_REPORT_BUNDLE); NOT PARTNERSHIP_DEED (partnership firm + profit-sharing ratios on stamp paper), NOT TRUST_DEED (trust/society, settlor/trustee/BYELAWS), NOT HUF_DEED (Karta + coparceners affidavit) - those are deeds, not RoC company-constitution filings. WARNING: filenames lie - a file named 'COI -' may be a lone certificate OR a full COI+MOA+AOA set; files named 'MOA -'/'AOA -' often contain several halves - judge by PAGE CONTENT and let layer 2 split. DECISIVE RULE: the file is a company incorporation / constitution document - it contains AT LEAST ONE of {Certificate of Incorporation (CIN + 'I hereby certify ... is incorporated'), Memorandum of Association of <Company>, Articles of Association of <Company>} - classify it as MOA_AOA_COI_BUNDLE and let layer 2 split it into COI / MOA / AOA. A lone single-page Certificate of Incorporation BELONGS HERE, not in UNKNOWN."
  classification_confidence_threshold: 0.85
